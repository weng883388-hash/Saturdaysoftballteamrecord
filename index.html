<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>振宇五金壘球記分</title>
<meta name="description" content="手機版壘球攻守即時記錄：打線編排、即時攻守紀錄、換人與戰績統計">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  /* ============ Design tokens ============ */
  :root{
    --bg:#f3f0e6;
    --surface:#ffffff;
    --surface-2:#eae4d3;
    --ink:#1c2620;
    --ink-dim:#5c6a5e;
    --line:#dcd5bf;
    --accent:#2f6b3a;
    --accent-ink:#ffffff;
    --accent-soft:#e2ecdf;
    --clay:#b8622f;
    --clay-soft:#f4e2cf;
    --danger:#a23b2f;
    --danger-soft:#f6dfd8;
    --gold:#9c7a1a;
    --gold-soft:#f2e6c2;
    --shadow:0 1px 2px rgba(28,38,32,.06), 0 6px 16px rgba(28,38,32,.08);
    --font-display:'Teko','Arial Narrow',sans-serif;
    --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140f;
      --surface:#1a2118;
      --surface-2:#212a1d;
      --ink:#e8ece5;
      --ink-dim:#9db09f;
      --line:#2c3527;
      --accent:#63b573;
      --accent-ink:#08130a;
      --accent-soft:#1f2f20;
      --clay:#e3935d;
      --clay-soft:#3a2717;
      --danger:#e2705d;
      --danger-soft:#3a201b;
      --gold:#e0c15f;
      --gold-soft:#332c14;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10140f;
    --surface:#1a2118;
    --surface-2:#212a1d;
    --ink:#e8ece5;
    --ink-dim:#9db09f;
    --line:#2c3527;
    --accent:#63b573;
    --accent-ink:#08130a;
    --accent-soft:#1f2f20;
    --clay:#e3935d;
    --clay-soft:#3a2717;
    --danger:#e2705d;
    --danger-soft:#3a201b;
    --gold:#e0c15f;
    --gold-soft:#332c14;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0;}
  button{font-family:inherit;}
  .tabular{font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}

  #app{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ============ Top bar ============ */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .topbar-inner{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;}
  .brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;}
  .brand-mark{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .brand-sub{font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:7px 10px;font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:5px;cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-2);}

  /* ============ Scoreboard ============ */
  .scoreboard{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    margin-top:12px;box-shadow:var(--shadow);overflow:hidden;
  }
  .sb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;flex-wrap:wrap;gap:4px;}
  .sb-status{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .sb-half{
    font-family:var(--font-display);font-size:20px;font-weight:600;
    color:var(--ink);white-space:nowrap;
  }
  .sb-inplay{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
  .sb-inplay.off{background:var(--accent-soft);color:var(--accent);}
  .sb-inplay.def{background:var(--clay-soft);color:var(--clay);}
  .outs-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);white-space:nowrap;}
  .out-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--danger);}
  .out-dot.on{background:var(--danger);}

  .linescore{width:100%;border-collapse:collapse;font-size:12px;}
  .linescore th,.linescore td{
    padding:5px 3px;text-align:center;border-bottom:1px solid var(--line);
    min-width:20px;
  }
  .linescore th{color:var(--ink-dim);font-weight:500;font-size:10.5px;}
  .linescore td.team{text-align:left;font-weight:700;padding-left:10px;white-space:nowrap;}
  .linescore tr.batting td.team{color:var(--accent);}
  .linescore td.tot{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);}
  .linescore-wrap{overflow-x:auto;padding:0 6px 10px;}

  /* ============ Batter card ============ */
  .batter-card{
    text-align:center;margin-top:14px;
  }
  .batter-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--font-display);font-size:18px;font-weight:700;margin-right:8px;vertical-align:middle;
  }
  .batter-num.def{background:var(--clay);}
  .batter-name{font-size:16px;font-weight:700;vertical-align:middle;}
  .batter-meta{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}

  /* ============ Sections / cards ============ */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-top:12px;box-shadow:var(--shadow);
  }
  .card h2{font-size:20px;margin-bottom:2px;}
  .card .hint{font-size:12px;color:var(--ink-dim);margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-dim);}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select{
    font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;
  }
  /* Read-only stand-in for an input — used where a value is derived
     automatically (e.g. current opponent batting-order number) rather
     than freely typed, so it shouldn't invite editing. */
  .field .static-val{
    font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    width:100%;box-sizing:border-box;font-weight:700;text-align:center;
  }
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;padding:10px;border:none;background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;}
  .seg button.active{background:var(--accent);color:var(--accent-ink);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 16px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:transparent;}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn.block{width:100%;}
  .btn:active{filter:brightness(.94);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* lineup rows */
  .lineup-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .lineup-row:last-child{border-bottom:none;}
  .order-num{width:22px;text-align:center;font-family:var(--font-display);font-size:17px;color:var(--ink-dim);flex:none;}
  .num-input{width:70px;flex:none;text-align:center;font-weight:700;font-size:16px;}
  .name-out{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .name-out.empty{color:var(--ink-dim);font-weight:400;}
  /* Lineup-builder-only name display: fixed to roughly fit 3 Chinese
     characters (this row already shows the jersey number, so the name
     doesn't need to claim the rest of the row's width like name-out
     does elsewhere, e.g. the substitution modal's longer "#88 王小明 (投)"
     rows, which still use .name-out and must NOT be narrowed). */
  .lb-name{flex:0 0 50px;width:50px;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-name.empty{color:var(--ink-dim);font-weight:400;}
  .pos-select{width:78px;flex:none;font-size:16px;padding:8px 2px;}
  .row-x{flex:none;width:28px;height:28px;border:none;background:none;color:var(--ink-dim);font-size:18px;cursor:pointer;}
  .bench-chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
    background:var(--surface-2);font-size:13px;font-weight:600;margin:3px 4px 3px 0;
  }
  .bench-chip button{border:none;background:none;color:var(--ink-dim);cursor:pointer;font-size:14px;padding:0;}
  .roster-hint{font-size:11.5px;color:var(--ink-dim);}

  /* result grid */
  .result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .rbtn{
    padding:14px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .rbtn small{font-family:var(--font-body);font-size:10px;font-weight:500;color:var(--ink-dim);}
  .rbtn.hit{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .rbtn.hit small{color:var(--accent);opacity:.8;}
  .rbtn.out{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .rbtn.out small{color:var(--danger);opacity:.8;}
  .rbtn.reach{background:var(--clay-soft);border-color:var(--clay);color:var(--clay);}
  .rbtn.reach small{color:var(--clay);opacity:.8;}
  .rbtn:active{filter:brightness(.95);}

  /* play confirm panel */
  .confirm-box{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:12px;background:var(--surface-2);}
  .confirm-title{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;cursor:pointer;}
  .stepper .val{min-width:22px;text-align:center;font-family:var(--font-display);font-size:18px;font-weight:700;}
  .kv-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
  .kv-row .k{font-size:13px;color:var(--ink-dim);}
  .chip-picker{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .field-svg{width:100%;max-width:320px;display:block;margin:0 auto;}
  .field-svg-lg{max-width:480px;}
  .fz-wedge{fill:var(--surface-2);stroke:var(--bg);stroke-width:2;cursor:pointer;}
  .fz-wedge.out{fill:var(--accent-soft);}
  .fz-wedge.in{fill:var(--clay-soft);}
  .fz-wedge.sel{fill:var(--clay);}
  .fz-label{font-family:var(--font-body);font-size:11px;font-weight:700;fill:var(--ink-dim);pointer-events:none;}
  .fz-label.sel{fill:#fff;}
  .fz-foul{stroke:var(--ink-dim);stroke-width:1;opacity:.45;}
  .fz-fence{fill:none;stroke:var(--ink-dim);stroke-width:1.5;opacity:.55;}
  .fz-home{fill:var(--ink);}

  /* end-half banner */
  .half-banner{
    background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);
    border-radius:12px;padding:14px;text-align:center;margin-top:12px;
  }
  .half-banner .btn{margin-top:8px;background:var(--gold);border-color:var(--gold);color:#241c05;}

  /* box score table */
  .stat-table-wrap{overflow-x:auto;}
  table.stats{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.stats th,table.stats td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.stats th{color:var(--ink-dim);font-weight:600;font-size:11px;}
  table.stats td.name{text-align:left;font-weight:700;}
  table.stats.sortable thead th{cursor:pointer;user-select:none;}
  table.stats.sortable thead th:hover{color:var(--accent);}
  table.stats.sortable thead th.sort-asc::after{content:" ▲";font-size:8px;}
  table.stats.sortable thead th.sort-desc::after{content:" ▼";font-size:8px;}

  /* game list */
  .game-item{
    display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface);
  }
  .game-item .gi-vs{flex:1;min-width:0;}
  .gi-opp{font-weight:700;font-size:15px;}
  .gi-meta{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
  .gi-score{font-family:var(--font-display);font-size:22px;font-weight:700;}
  .status-pill{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;}
  .status-pill.live{background:var(--danger-soft);color:var(--danger);}
  .status-pill.final{background:var(--surface-2);color:var(--ink-dim);}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(10,14,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{
    background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:16px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  }
  .modal h3{font-size:19px;margin-bottom:10px;}
  .close-x{float:right;border:none;background:var(--surface-2);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}

  /* bottom action bar */
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.06);
  }
  .action-bar-inner{max-width:560px;margin:0 auto;display:flex;gap:8px;}
  .action-bar-inner .btn{flex:1;}
  .action-bar-inner.three .btn{font-size:12.5px;padding:11px 4px;}

  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-dim);}
  .empty-state .em{font-size:34px;margin-bottom:8px;}

  a.link-reset{font-size:11.5px;color:var(--ink-dim);text-decoration:underline;cursor:pointer;}

  @media (max-width:380px){
    .result-grid{grid-template-columns:repeat(3,1fr);}
    .zone-map{grid-template-columns:repeat(4,1fr);}
  }

  /* ============ 先前打擊成績 (recent-history) panel ============ */
  .history-panel{margin-top:10px;}
  .hist-title{font-size:11.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
  .hist-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .hist-chip{
    font-family:var(--font-display);font-size:12.5px;font-weight:700;
    padding:3px 9px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-dim);
  }
  .hist-chip.hit{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .hist-chip.out{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .hist-chip.reach{background:var(--clay-soft);border-color:var(--clay);color:var(--clay);}
  .zone-hint-card{text-align:center;}

  /* ============ Landscape recording layout ============ */
  /* renderGame() wraps the scoreboard/history, result-picker and
     location/reference panels in .gb-left / .gb-mid / .gb-zone inside
     .game-body. In portrait these are just three stacked blocks (no
     behavior change). Landscape phones get real screen width, so we lay
     them out as three side-by-side columns between the sticky top bar
     and the fixed bottom action bar, and let each column scroll on its
     own — that's what keeps the "選結果 / 記落點" screen on one view
     without having to swipe the whole page up and down mid-play. */
  @media (orientation:landscape) and (min-width:640px){
    #app:has(.game-body){max-width:1100px;}
    body:has(.game-body){padding-bottom:calc(56px + env(safe-area-inset-bottom));}
    .game-body{
      display:grid;
      grid-template-columns:minmax(160px,0.9fr) minmax(220px,1.25fr) minmax(160px,0.9fr);
      gap:10px;
      margin-top:10px;
      align-items:start;
    }
    .game-body .gb-col{
      /* `100vh` is the classic mobile-Safari trap: it reports the
         viewport as if the browser/app chrome (URL bar, and here also
         the claude.ai artifact header above the iframe) were hidden,
         even while it's actually on screen — so calc(100vh - Npx)
         comes out taller than what's really visible. The column's own
         scroll never kicks in, and instead the OUTER app page has to be
         dragged to see the rest, losing the sticky topbar/action bar —
         the opposite of what this layout is for. `100svh` ("small"
         viewport height) is the standards fix — it always accounts for
         visible chrome — layered in below for browsers that support it.
         The 300px ceiling is the real safety net for everyone else: a
         wrong/inflated vh can't push a column past a landscape phone's
         actual usable height; a genuinely short viewport just shrinks
         below it either way. The 105px subtracted is the topbar (~40px)
         + action bar (~37px, more with a home-indicator safe area) +
         .game-body's own top margin (10px), measured directly off the
         rendered elements rather than guessed — a stale guess here is
         exactly what under-sized the columns on a real device on
         2026-09-14 (see changelog): re-measure before changing this
         again rather than eyeballing a new constant. */
      max-height:min(300px, calc(100vh - 105px));
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    @supports (height:100svh){
      .game-body .gb-col{ max-height:min(300px, calc(100svh - 105px)); }
    }
    .game-body .scoreboard{margin-top:0;}
    .game-body .sb-head{padding:6px 8px 2px;}
    .game-body .sb-half{font-size:15px;}
    .game-body .sb-inplay{font-size:9px;padding:1px 5px;}
    .game-body .outs-row{font-size:10.5px;}
    .game-body .out-dot{width:8px;height:8px;}
    .game-body .linescore-wrap{padding:0 4px 3px;}
    .game-body .linescore th,.game-body .linescore td{padding:2px 2px;}
    .game-body .linescore{font-size:10.5px;}
    .game-body .linescore td.tot{font-size:13px;}
    .game-body .batter-card{margin-top:3px;}
    .game-body .batter-num{width:20px;height:20px;font-size:11px;margin-right:3px;}
    .game-body .batter-name{font-size:11px;}
    .game-body .batter-meta{font-size:8.5px;margin-top:0;}
    .game-body .history-panel{margin-top:3px;}
    .game-body .hist-title{font-size:9.5px;margin-bottom:2px;}
    .game-body .hist-chip{font-size:10px;padding:1px 6px;}
    .game-body .card{margin-top:4px;padding:6px 8px;}
    .game-body .card:first-child{margin-top:0;}
    .game-body .card .field{margin-bottom:4px;}
    .game-body .card .field label{font-size:10.5px;}
    .game-body .card .field input,.game-body .card .field .static-val{padding:4px 6px;font-size:12.5px;}
    .game-body .card .hint{margin-bottom:3px;}
    .game-body .result-grid{grid-template-columns:repeat(4,1fr);gap:4px;}
    .game-body .rbtn{padding:4px 2px;font-size:11px;gap:0;}
    .game-body .rbtn small{font-size:7px;}
    .game-body .field-svg{max-width:175px;}
    .action-bar{padding:4px 14px calc(4px + env(safe-area-inset-bottom));}
    .action-bar-inner.three .btn{font-size:10px;padding:6px 4px;}
    body:has(.game-body) .topbar-inner{padding:4px 10px;gap:6px;}
    body:has(.game-body) .icon-btn{padding:4px 7px;font-size:11px;}
    body:has(.game-body) .brand-mark{font-size:14px!important;}
    body:has(.game-body) .roster-hint{font-size:9.5px;}
    /* Zone/analysis cards (gb-zone column): the options row (metric

// and the leaderboard's minimum-PA qualification need a real "total games"

// imported). A season with no entry here (the current "2026聯賽賽季", or
// any future season) has no fixed count — its total games is simply how
// many games this app has actually recorded for it, which grows as the
// team plays.
const SEASON_GAME_COUNTS = { "2025":24, "2025-2026聯賽":24 };

// already filtered to this season (or, for "生涯", every recorded game) —
// see renderAttendanceView. For "生涯" we can't just use games.length: a
// closed imported season's 24 games mostly aren't individual `games`/
// `games_final` documents, so they'd be invisible to a plain count. Sum
// each known imported season's fixed count, plus actually-recorded games
// belonging to seasons NOT in that fixed map (the current season and any
// future one), so a season already counted via its fixed total is never
// double-counted even if a handful of its games also happen to exist as
// real documents (e.g. a couple of manually-entered historical games).
function totalGamesForScope(seasonFilter, gamesInScope, allGames){
  if (seasonFilter !== "生涯"){
    return SEASON_GAME_COUNTS[seasonFilter] != null ? SEASON_GAME_COUNTS[seasonFilter] : gamesInScope.length;

  const fixedTotal = Object.values(SEASON_GAME_COUNTS).reduce((a,b)=>a+b,0);
  const nonImportedCount = allGames.filter(g=>!g.oppLogOnly && SEASON_GAME_COUNTS[gameSeason(g)]==null).length;
  return fixedTotal + nonImportedCount;
}

/* ---------------------------------------------------------------------
   Supabase adapter — implements the same tiny subset of the Firestore-
   style db interface that Store below already speaks (doc().get/set/
   delete, collection().orderBy().limit().get()), so Store itself needs
   no changes at all: only which `db` object it's handed differs.
   Backed by a single Postgres table "kv_store" (path text primary key,
   collection text, data jsonb, created_at bigint) — see the migration
   guide for the exact SQL. This means every existing doc path (e.g.
   "team/roster", "games/xxx", "games_final/xxx") keeps working
   unchanged; only the storage engine underneath is swapped out.
--------------------------------------------------------------------- */
function createSupabaseDb(url, anonKey){
  const sb = window.supabase.createClient(url, anonKey);
  function splitPath(path){
    const i = path.indexOf("/");
    return { collection: path.slice(0,i), id: path.slice(i+1) };
  }
  function docRef(path){
    return {
      async get(){
        const { data, error } = await sb.from("kv_store").select("data").eq("path", path).maybeSingle();
        if (error) throw error;
        return { exists: !!data, data(){ return data ? data.data : undefined; } };
      },
      async set(obj){
        const { collection } = splitPath(path);
        const row = { path, collection, data: obj, created_at: obj.createdAt || Date.now() };
        const { error } = await sb.from("kv_store").upsert(row, {onConflict:"path"});
        if (error) throw error;
      },
      async delete(){
        const { error } = await sb.from("kv_store").delete().eq("path", path);
        if (error) throw error;
      }
    };
  }
  function collectionRef(name){
    let _orderDir = null, _limit = null;
    const builder = {
      orderBy(field, dir){ _orderDir = dir; return builder; }, // only createdAt is ever ordered on
      limit(n){ _limit = n; return builder; },
      async get(){
        let q = sb.from("kv_store").select("path,data").eq("collection", name);
        if (_orderDir) q = q.order("created_at", { ascending: _orderDir !== "desc" });
        if (_limit) q = q.limit(_limit);
        const { data, error } = await q;
        if (error) throw error;
        return { docs: (data||[]).map(r => ({ id: r.path.slice(name.length+1), data: () => r.data })) };
      }
    };
    return builder;
  }
  return { doc: docRef, collection: collectionRef };
}

/* ---------------------------------------------------------------------
   Storage adapter: Supabase (if configured) → Claude db capability
   (if running inside a Claude Artifact) → else localStorage.
--------------------------------------------------------------------- */
const Store = (function(){
  let db = null;
  let ready = (async () => {
    try{
      if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient){
        db = createSupabaseDb(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      } else if (window.claude && window.claude.use){
        db = await window.claude.use("db");
      }
    }catch(e){ db = null; }
    return db;
  })();

  const LS_ROSTER = "sb_roster_v1";
  const LS_GAMES = "sb_games_v1";
  const LS_ACTIVE = "sb_active_v1";

  function lsGetGames(){ try{ return JSON.parse(localStorage.getItem(LS_GAMES)||"[]"); }catch(e){ return []; } }
  function lsSaveGames(list){ try{ localStorage.setItem(LS_GAMES, JSON.stringify(list)); }catch(e){} }

  return {
    async usingDb(){ await ready; return !!db; },

    async getRoster(){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/roster").get();
          if (snap.exists && snap.data().players && snap.data().players.length){
            // The db capability's own docs say it plainly: "Delivered
            // snapshots and their data() are frozen ... clone a body
            // before editing it for a write." Everything this Store
            // hands back to the app crosses that boundary once, here,
            // via clone() (JSON round-trip) — see the matching note on
            // loadGame() below for the concrete bug this was causing.
            return clone(snap.data().players);
          }
          await db.doc("team/roster").set({players:DEFAULT_ROSTER, updatedAt:Date.now()});
          return DEFAULT_ROSTER;
        }catch(e){ /* fall through to LS */ }
      }
      try{
        const raw = localStorage.getItem(LS_ROSTER);
        if (raw) return JSON.parse(raw);
        localStorage.setItem(LS_ROSTER, JSON.stringify(DEFAULT_ROSTER));
      }catch(e){}
      return DEFAULT_ROSTER;
    },

    async saveRoster(players){
      await ready;
      if (db){
        try{ await db.doc("team/roster").set({players, updatedAt:Date.now()}); return; }catch(e){}
      }
      try{ localStorage.setItem(LS_ROSTER, JSON.stringify(players)); }catch(e){}
    },

    // Read-only historical per-player season snapshots imported from the
    // team's season-tracking spreadsheet (from before this app existed,
    // or covering an already-closed season) — "season_2025" and
    // "season_2025_2026" are the two keys currently populated. Each is a
    // {rows:[...]} document of raw counting-stat lines (see
    // BATTING_COUNT_FIELDS); there's no in-app editor for these, they're
    // maintained by re-importing from the spreadsheet.
    async getSeasonStats(key){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/"+key).get();
          if (snap.exists) return clone(snap.data().rows || []);
        }catch(e){}
      }
      try{
        const raw = localStorage.getItem("sb_"+key+"_v1");
        if (raw) return JSON.parse(raw);
      }catch(e){}
      return [];
    },

    // Read-only historical TEAM-level standings (see TEAM_RECORD_IMPORT_KEYS)
    // imported from the team spreadsheet or a hand-written points sheet.
    // Each row is {team, points, rank, results:[...]} — `results` (an
    // ordered list of "勝"/"和"/"敗") is only present when the source had
    // a clean per-slot sequence; otherwise it's an empty array.
    async getTeamRecord(key){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/"+key).get();
          if (snap.exists) return clone(snap.data().rows || []);
        }catch(e){}
      }
      try{
        const raw = localStorage.getItem("sb_"+key+"_v1");
        if (raw) return JSON.parse(raw);
      }catch(e){}
      return [];
    },

    // Manually-entered results for games this app never recorded — i.e.
    // games BETWEEN TWO OTHER TEAMS (this app only lets a scorer record
    // 振宇五金's own at-bats, so it has no way to generate a game between
    // two opponents on its own). This is what lets 球隊戰績 show a real
    // multi-team standings table for the CURRENT season going forward,
    // instead of only being possible for a past season via a one-time
    // spreadsheet/photo import (see TEAM_RECORD_IMPORT_KEYS) — see
    // computeFullStandings() below. Single doc "team/leaguegames", one
    // flat array covering every season (each row tags its own `season`/
    // `competitionType`, same pattern as a game document) so there's no
    // per-season doc management; editable going forward via 球隊戰績's
    // 「其他球隊比分」card (admin-gated, same as editing a final game).
    async getLeagueGames(){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/leaguegames").get();
          if (snap.exists) return clone(snap.data().rows || []);
        }catch(e){}
      }
      try{
        const raw = localStorage.getItem("sb_leaguegames_v1");
        if (raw) return JSON.parse(raw);
      }catch(e){}
      return [];
    },
    async saveLeagueGames(rows){
      await ready;
      if (db){
        try{ await db.doc("team/leaguegames").set({rows, updatedAt:Date.now()}); return {ok:true}; }
        catch(e){ return {ok:false, code:e&&e.code}; }
      }
      try{ localStorage.setItem("sb_leaguegames_v1", JSON.stringify(rows)); }catch(e){}
      return {ok:true};
    },

    // Version 48 新增：賽程表（見 DEFAULT_SCHEDULE／renderScheduleView）。跟
    // team/roster 一樣，第一次讀取、資料庫裡還沒有 team/schedule 文件時，用
    // DEFAULT_SCHEDULE（試算表匯入的初始賽程）當種子資料寫入一次；之後每次
    // 讀取都是使用者自己編輯過的版本，不會再被 DEFAULT_SCHEDULE 覆蓋。跟
    // team/leaguegames 一樣是單一文件、一個扁平陣列（每一列自帶
    // season，同一份文件涵蓋所有球季，不用每季另外開一份文件）。
    async getSchedule(){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/schedule").get();
          if (snap.exists) return clone(snap.data().rows || []);
          await db.doc("team/schedule").set({rows: DEFAULT_SCHEDULE, updatedAt: Date.now()});
          return clone(DEFAULT_SCHEDULE);
        }catch(e){ /* fall through to LS */ }
      }
      try{
        const raw = localStorage.getItem("sb_schedule_v1");
        if (raw) return JSON.parse(raw);
        localStorage.setItem("sb_schedule_v1", JSON.stringify(DEFAULT_SCHEDULE));
      }catch(e){}
      return clone(DEFAULT_SCHEDULE);
    },
    async saveSchedule(rows){
      await ready;
      if (db){
        try{ await db.doc("team/schedule").set({rows, updatedAt:Date.now()}); return {ok:true}; }
        catch(e){ return {ok:false, code:e&&e.code}; }
      }
      try{ localStorage.setItem("sb_schedule_v1", JSON.stringify(rows)); }catch(e){}
      return {ok:true};
    },

    // Finished games live in "games_final", which is write-locked to
    // admins (see the db rules declared on publish) — anyone can still
    // read them for stats, but only an admin can edit or delete one.
    // In-progress games live in plain "games", writable by any
    // signed-in teammate helping to score.
    async listGames(){
      await ready;
      if (db){
        try{
          const [liveQ, finalQ] = await Promise.all([
            db.collection("games").orderBy("createdAt","desc").limit(30).get(),
            db.collection("games_final").orderBy("createdAt","desc").limit(30).get(),
          ]);
          // clone() every doc here too — see loadGame() below for why this
          // matters. Cheap insurance: nothing in this list is normally
          // mutated in place (it's read for display/aggregation), but a
          // frozen object silently swallowing a future edit is exactly the
          // kind of bug that's nearly impossible to notice until someone
          // hits it for real, so every document leaving Store is cloned,
          // not just the one path that happened to get reported.
          const all = [
            ...liveQ.docs.map(d=>clone({id:d.id, ...d.data()})),
            ...finalQ.docs.map(d=>clone({id:d.id, ...d.data()})),
          ];
          all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
          return all;
        }catch(e){}
      }
      return lsGetGames().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    },

    async loadGame(id){
      await ready;
      if (db){
        try{
          // ⚠️ Root cause of "已完賽的打擊紀錄沒辦法編輯／改了資料庫沒跟著改"
          // (see Version 27 in the changelog): the db capability's own
          // type definitions say plainly that a delivered snapshot and its
          // data() are FROZEN, and warn to "clone a body before editing it
          // for a write." `{id, ...snap.data()}` only shallow-spreads the
          // TOP level into a fresh object — game.plays (and every play
          // object inside it, plus lineup/statOverrides/etc.) stayed the
          // SAME frozen references from the snapshot. So editPlayField()
          // etc. mutating `game.plays[idx].code = value` was a silent
          // no-op (no error, because the page isn't in strict mode) —
          // AppState.game.updatedAt (a fresh top-level property) still
          // updated and still saved fine, which is exactly why persistGame()
          // always reported success and the doc's version kept climbing,
          // while every actual field stayed byte-identical. clone() here
          // (a JSON round-trip) produces an entirely fresh, fully mutable
          // object graph, so this can never happen again for anything
          // loaded through Store.
          const snap = await db.doc("games/"+id).get();
          if (snap.exists) return clone({id, ...snap.data()});
          const fsnap = await db.doc("games_final/"+id).get();
          if (fsnap.exists) return clone({id, ...fsnap.data()});
        }catch(e){}
      }
      return lsGetGames().find(g=>g.id===id) || null;
    },

    async saveGame(game){
      await ready;
      const coll = game.status==="final" ? "games_final" : "games";
      if (db){
        try{ await db.doc(coll+"/"+game.id).set(game); return {ok:true}; }
        catch(e){ return {ok:false, code:e&&e.code}; }
      }
      const list = lsGetGames();
      const idx = list.findIndex(g=>g.id===game.id);
      if (idx>=0) list[idx]=game; else list.push(game);
      lsSaveGames(list);
      return {ok:true};
    },

    // Move a game between the live and final collections (a status
    // transition), so it ends up gated by the right write rule.
    async moveGame(game, fromColl, toColl){
      await ready;
      if (db){
        try{ await db.doc(toColl+"/"+game.id).set(game); }
        catch(e){ return {ok:false, code:e&&e.code}; }
        try{
          await db.doc(fromColl+"/"+game.id).delete();
        }catch(e){
          // Couldn't remove the old copy (e.g. a non-admin trying to
          // reopen a finished game, where deleting from games_final
          // needs admin). Roll back the write so we don't end up with
          // the same game duplicated in both collections.
          try{ await db.doc(toColl+"/"+game.id).delete(); }catch(e2){}
          return {ok:false, code:e&&e.code};
        }
        return {ok:true};
      }
      const list = lsGetGames();
      const idx = list.findIndex(g=>g.id===game.id);
      if (idx>=0) list[idx]=game; else list.push(game);
      lsSaveGames(list);
      return {ok:true};
    },

    async deleteGame(id, wasFinal){
      await ready;
      const coll = wasFinal ? "games_final" : "games";
      if (db){
        try{ await db.doc(coll+"/"+id).delete(); return {ok:true}; }
        catch(e){ return {ok:false, code:e&&e.code}; }
      }
      lsSaveGames(lsGetGames().filter(g=>g.id!==id));
      return {ok:true};
    },

    async getActiveGameId(){
      await ready;
      if (db){
        try{
          const snap = await db.doc("team/state").get();
          if (snap.exists) return snap.data().activeGameId || null;
        }catch(e){}
      }
      try{ return localStorage.getItem(LS_ACTIVE) || null; }catch(e){ return null; }
    },

    async setActiveGameId(id){
      await ready;
      if (db){
        try{ await db.doc("team/state").set({activeGameId:id||null, updatedAt:Date.now()}); return; }catch(e){}
      }
      try{
        if (id) localStorage.setItem(LS_ACTIVE, id); else localStorage.removeItem(LS_ACTIVE);
      }catch(e){}
    },
  };
})();

function rosterLookup(number){
  const r = AppState.roster.find(p=>p.number===String(number));
  if (r) return r.name;
  const f = formerPlayersFromImports().find(p=>p.number===String(number));
  return f ? f.name : "";
}

// Departed players who wore the same jersey number as a current roster
// player are disambiguated in the imported historical data (see
// team/season_2025, team/season_2025_2026) by suffixing their row's
// `number` with "(原)" — e.g. old #19 王崇綺 is stored as "19(原)" so he
// no longer collides with current #19 鍾嘉文 in battingKey()/mergeBattingLists.
// This derives the selectable list of such players straight from whatever
// imported rows carry that suffix, so 球員生涯查詢／投手成績查詢 can offer
// them without hardcoding names/numbers here — any future duplicate-number
// departure just needs the same "(原)" suffix applied to its imported rows.
function formerPlayersFromImports(){
  const seen = new Map();
  Object.values(AppState.seasonStats||{}).forEach(rows=>{
    (rows||[]).forEach(r=>{
      if (r.number && String(r.number).includes("(原)") && !seen.has(r.number)){
        seen.set(r.number, {number:String(r.number), name:r.name||""});
      }
    });
  });
  return Array.from(seen.values());
}

/* ---------------------------------------------------------------------
   Game construction
--------------------------------------------------------------------- */
function newGame({opponent, batFirst, ourTeamName, date}){
  return {
    id: "g_"+uid(),
    opponent: opponent || "對手",
    ourTeamName: ourTeamName || "振宇五金",
    date: date || todayStr(),
    batFirst: !!batFirst,          // true: our team bats in the "top" half
    status:"setup",                // setup | live | final
    lineup: [],                    // {id, order, number, name, position}
    bench: [],                     // {number, name}
    oppRoster: [],                 // {number, name} — optional, no position, in batting order
    oppBattingSlots: 10,            // total opponent batting-order slots (10 or 11); governs oppRoster's fixed length
    battingIdx: 0,
    oppBattingIdx: 0,
    inning: 1,
    half: "top",                   // top | bottom
    outs: 0,
    linescore: {top:[], bottom:[]},
    plays: [],
    oppNumber: "",
    oppNote: "",
    // Which season this game counts toward (see gameSeason()/SEASON_DEFAULT)
    // and what kind of competition it is (see isLeagueGame()) — only
    // "聯賽" (regular league) games feed the career/season totals in
    // 球員生涯查詢; 盃賽/季後賽 games are tracked separately.
    // Both are editable after creation (setup screen, or 編輯紀錄 for an
    // already-started game) so a mis-tagged game can be corrected.
    season: SEASON_DEFAULT,
    competitionType: "聯賽",   // 聯賽 | 盃賽 | 季後賽
    finalWinPitcher: null,   // {number,name} | null
    finalMvp: null,          // {number,name} | null
    // Admin-only manual corrections. Per-number partial overrides that win
    // over whatever the play log computes — for fixing a typo'd RBI/K, or
    // filling in a pitching line for a game with no per-batter defensive
    // data (e.g. an imported historical result).
    statOverrides: { batting:{}, pitching:{} },
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
}
function ensureOverrides(g){
  if (!g.statOverrides) g.statOverrides = {batting:{}, pitching:{}};
  if (!g.statOverrides.batting) g.statOverrides.batting = {};
  if (!g.statOverrides.pitching) g.statOverrides.pitching = {};
  return g.statOverrides;
}

// Small "2026聯賽賽季" / "🏆 盃賽" style label for a game, used on the
// live/final game screens and the home list so it's obvious at a glance
// which season or competition a game is tagged as.
function gameSeasonTagHTML(g){
  const league = isLeagueGame(g);
  const label = league ? gameSeason(g) : (g.competitionType||"");
  return `${league?"":"🏆 "}${esc(label)}`;
}

function isOurHalf(game){
  return (game.half==="top") === game.batFirst;
}
function ourRow(game){ return game.batFirst ? game.linescore.top : game.linescore.bottom; }
function oppRow(game){ return game.batFirst ? game.linescore.bottom : game.linescore.top; }
function ourTotal(game){ return ourRow(game).reduce((a,b)=>a+(b||0),0); }
function oppTotal(game){ return oppRow(game).reduce((a,b)=>a+(b||0),0); }

// The player currently assigned position "投" (pitcher) is automatically
// the pitcher of record — no separate manual selection needed.
function currentPitcher(game){
  return game.lineup.find(r=>r.position==="投") || null;
}

// The opponent roster is kept in batting-order (insertion order); this
// resolves whichever slot is "at bat" right now, cycling automatically.
function currentOppBatter(game){
  if (!game.oppRoster || !game.oppRoster.length) return null;
  return game.oppRoster[(game.oppBattingIdx||0) % game.oppRoster.length];
}
function syncOppBatter(game){
  const b = currentOppBatter(game);
  if (b){ game.oppNumber = b.number; game.oppNote = b.name; }
}

// Games list to use for in-game reference lookups (e.g. the current
// opponent batter's historical zone tendencies): AppState.games is a
// snapshot loaded at boot/entry into other views, so it won't reflect
// plays recorded so far in the CURRENTLY live game. Swap in the live
// AppState.game itself so at-bats already recorded this game against this
// same batter are counted too.
function gamesForZoneRef(){
  const g = AppState.game;
  if (!g) return AppState.games||[];
  const others = (AppState.games||[]).filter(x=>x.id!==g.id);
  return [...others, g];
}

// Candidates for "who scored": the current batter plus up to the previous
// 5 slots in the batting order (the only players who could plausibly be
// on base right now).
function scorerCandidates(game){
  const n = game.lineup.length;
  if (!n) return [];
  const cur = game.battingIdx % n;
  const count = Math.min(6, n);
  const list = [];
  for (let k=0;k<count;k++){ list.push(game.lineup[(cur - k + n*100) % n]); }
  return list;
}

async function persistGame(){
  if (AppState.game.status==="final" && !requireAdmin("修改已完賽的紀錄")){
    return {ok:false, code:"admin-required"};
  }
  AppState.game.updatedAt = Date.now();
  const res = await Store.saveGame(AppState.game);
  if (res && res.ok===false){
    appAlert("儲存失敗，請檢查網路連線後再試一次。");
  }
  return res;
}

const $app = document.getElementById("app");
// Click-to-sort for any <table class="stats sortable">: delegated on $app
// (a stable node whose innerHTML gets replaced every render(), so this is
// registered once here rather than re-attached per row/table) — clicking a
// header cell sorts the tbody rows by that column, toggling asc/desc.
$app.addEventListener("click", function(e){
  const th = e.target.closest("table.sortable thead th");
  if (!th) return;
  sortStatsTable(th);
});
function sortStatsTable(th){
  const table = th.closest("table");
  const theadRow = th.parentElement;
  const idx = Array.prototype.indexOf.call(theadRow.children, th);
  const tbody = table.querySelector("tbody");
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll("tr"));
  // Placeholder "尚無資料" rows use a single colspan cell — nothing to sort.
  if (!rows.length || rows.some(r=>r.children.length < theadRow.children.length)) return;
  const dir = th.dataset.sortDir === "asc" ? "desc" : "asc";
  Array.from(theadRow.children).forEach(h=>{
    if (h!==th){ delete h.dataset.sortDir; h.classList.remove("sort-asc","sort-desc"); }
  });
  th.dataset.sortDir = dir;
  th.classList.remove("sort-asc","sort-desc");
  th.classList.add(dir==="asc" ? "sort-asc" : "sort-desc");
  const isLabelCol = idx===0; // 球員／背號／投手 first column: always text
  rows.sort((a,b)=>{
    const av = a.children[idx].textContent.trim();
    const bv = b.children[idx].textContent.trim();
    if (isLabelCol) return dir==="asc" ? av.localeCompare(bv,"zh-Hant") : bv.localeCompare(av,"zh-Hant");
    const an = parseFloat(av.replace(/[^0-9.\-]/g,""));
    const bn = parseFloat(bv.replace(/[^0-9.\-]/g,""));
    const aNum = isNaN(an) ? -Infinity : an;
    const bNum = isNaN(bn) ? -Infinity : bn;
    return dir==="asc" ? aNum-bNum : bNum-aNum;
  });
  rows.forEach(r=>tbody.appendChild(r));
}
function render(){
  const s = AppState;
  // Every view function rebuilds $app.innerHTML from scratch, which destroys
  // and recreates any open modal (edit-game, box score, sub, end-game, etc.)
  // on every single field edit. Without this, a user scrolled down a long
  // modal (e.g. editing play #20 of 30 in a finished game) gets bounced back
  // to the top of the modal after every keystroke/change, making it look
  // like the edit did nothing even though it saved correctly. Capture the
  // open modal's scroll position before re-rendering and restore it after.
  const prevModal = document.querySelector(".modal-back .modal");
  const prevScrollTop = prevModal ? prevModal.scrollTop : null;
  if (s.view==="loading") renderLoading();
  else if (s.view==="home") renderHome();
  else if (s.view==="setup") renderSetup();
  else if (s.view==="lineup") renderLineupBuilder();
  else if (s.view==="game") renderGame();
  else if (s.view==="stats") renderStatsView();
  else if (s.view==="attendance") renderAttendanceView();
  else if (s.view==="schedule") renderScheduleView();
  // Global confirm modal, appended after whichever view just rendered, so
  // every confirm() call site works no matter which screen is showing.
  if (s.ui && s.ui.confirmMsg){
    $app.insertAdjacentHTML("beforeend", renderConfirmModal());
  }
  if (s.ui && s.ui.alertMsg){
    $app.insertAdjacentHTML("beforeend", renderAlertModal());
  }
  if (prevScrollTop){
    const nextModal = document.querySelector(".modal-back .modal");
    if (nextModal) nextModal.scrollTop = prevScrollTop;
  }
}

// window.confirm()/alert()/prompt() are unreliable inside a published
// Artifact: the page runs in a sandboxed iframe on claude.ai, and a
// sandbox without "allow-modals" silently suppresses native dialogs —
// the call just returns false immediately with no dialog ever shown.
// That reads to a user as "I tapped the button and nothing happened",
// which is exactly the bug reported for 刪除紀錄 (delete). So every
// destructive action goes through this in-page, Promise-based modal
// instead of the native confirm(). Pattern: `if (!(await appConfirm(msg))) return;`
// in an async function.
let _pendingConfirmResolve = null;
function appConfirm(message){
  return new Promise(resolve=>{
    _pendingConfirmResolve = resolve;
    AppState.ui.confirmMsg = message;
    render();
  });
}
function resolveConfirm(v){
  AppState.ui.confirmMsg = null;
  const r = _pendingConfirmResolve;
  _pendingConfirmResolve = null;
  render();
  if (r) r(v);
}
function renderConfirmModal(){
  return `<div class="modal-back" style="z-index:200;" onclick="if(event.target===this){resolveConfirm(false);}">
    <div class="modal" style="max-width:340px;">
      <div style="font-size:15px;line-height:1.6;white-space:pre-wrap;">${esc(AppState.ui.confirmMsg)}</div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn ghost" style="flex:1;" onclick="resolveConfirm(false)">取消</button>
        <button class="btn danger" style="flex:1;" onclick="resolveConfirm(true)">確定</button>
      </div>
    </div>
  </div>`;
}
// Same reasoning as appConfirm() above — native alert() is silently
// suppressed inside the sandboxed Artifact iframe, so error/notice
// messages (e.g. the admin-only permission notices) need their own
// in-page modal too, or they'd vanish with no visible feedback at all.
function appAlert(message){
  AppState.ui.alertMsg = message;
  render();
}
function closeAlert(){
  AppState.ui.alertMsg = null;
  render();
}
function renderAlertModal(){
  return `<div class="modal-back" style="z-index:210;" onclick="if(event.target===this){closeAlert();}">
    <div class="modal" style="max-width:340px;">
      <div style="font-size:15px;line-height:1.6;white-space:pre-wrap;">${esc(AppState.ui.alertMsg)}</div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn primary" style="flex:1;" onclick="closeAlert()">知道了</button>
      </div>
    </div>
  </div>`;
}

  $app.innerHTML = `<div class="empty-state" style="padding-top:80px;"><div class="em">🥎</div>載入中…</div>`;

function esc(str){ return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt3(n){ return (n||0).toFixed(3).replace(/^0\./,"."); }

/* ---------- Season-wide aggregation (across all saved games) ---------- */
const BATTING_COUNT_FIELDS = ["PA","AB","H","1B","2B","3B","HR","BB","SF","RBI","R","K","DP","E"];

// Shared rate-stat pass: takes a list of rows that already have the raw
// counting fields (PA/AB/H/…) filled in and adds AVG/OBP/SLG/OPS/ISO plus
// an OPS+ computed against a baseline line. By default that baseline is
// just the SAME list's own combined totals (100 = exactly average across
// whatever this particular list covers). An optional `oppTotals` (raw
// AB/H/1B/2B/3B/HR/BB/SF pooled from recorded opponent at-bats — see
// computeOpponentTotals) is folded into the baseline pool alongside the
// list's own totals, so OPS+ is standardized against league-wide batting
// (our players + recorded opponents) rather than only our own team's
// output; omit it (or pass nothing) for the old team-only baseline. Used
// by computeSeasonBatting and by mergeBattingLists so every batting table
// in the app derives rates the same way, whatever the source of counts.
function deriveBattingRates(list, oppTotals){
  list.forEach(r=>{
    r.AVG = r.AB>0 ? r.H/r.AB : 0;
    r.OBP = (r.AB+r.BB+r.SF)>0 ? (r.H+r.BB)/(r.AB+r.BB+r.SF) : 0;
    r.SLG = r.AB>0 ? (r["1B"]+2*r["2B"]+3*r["3B"]+4*r.HR)/r.AB : 0;
    r.OPS = r.OBP+r.SLG;
    r.ISO = r.SLG - r.AVG;
  });
  const ot = oppTotals || {};
  const totAB = list.reduce((a,r)=>a+r.AB,0) + (ot.AB||0);
  const totH = list.reduce((a,r)=>a+r.H,0) + (ot.H||0);
  const totBB = list.reduce((a,r)=>a+r.BB,0) + (ot.BB||0);
  const totSF = list.reduce((a,r)=>a+r.SF,0) + (ot.SF||0);
  const tot1B = list.reduce((a,r)=>a+r["1B"],0) + (ot["1B"]||0);
  const tot2B = list.reduce((a,r)=>a+r["2B"],0) + (ot["2B"]||0);
  const tot3B = list.reduce((a,r)=>a+r["3B"],0) + (ot["3B"]||0);
  const totHR = list.reduce((a,r)=>a+r.HR,0) + (ot.HR||0);
  const teamOBP = (totAB+totBB+totSF)>0 ? (totH+totBB)/(totAB+totBB+totSF) : 0;
  const teamSLG = totAB>0 ? (tot1B+2*tot2B+3*tot3B+4*totHR)/totAB : 0;
  const teamOPS = teamOBP+teamSLG;
  list.forEach(r=>{
    r.OPSPlus = (teamOPS>0 && r.AB>0) ? Math.round(1000*r.OPS/teamOPS)/10 : 0;
  });
  return list;
}

// Raw counting-stat pass only (no rate stats / OPS+) — split out of
// computeSeasonBatting so seasonBattingFor can combine raw rows from
// multiple sources before deriving rates once, with an opponent-pool
// baseline folded in. computeSeasonBatting itself keeps its original
// team-only-baseline behavior for direct callers (e.g. competitionBattingFor).
function computeSeasonBattingRaw(games){
  // Built on top of computeBoxScore (rather than re-walking plays) so a
  // per-game manual override is automatically reflected in the season
  // totals too, in exactly one place.
  const rows = {};
  function ensure(num,name){
    if (!rows[num]) rows[num] = {number:num,name,PA:0,AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,SF:0,RBI:0,R:0,K:0,DP:0,E:0};
    return rows[num];
  }
  games.forEach(g=>{
    computeBoxScore(g).forEach(gr=>{
      const r = ensure(gr.number, gr.name);
      BATTING_COUNT_FIELDS.forEach(f=>{ r[f] += gr[f]||0; });
    });
  });
  return Object.values(rows);
}
function computeSeasonBatting(games){
  return deriveBattingRates(computeSeasonBattingRaw(games));
}

// Identity key for merging batting rows from different sources (live
// in-app games, imported historical seasons) — by jersey number when one
// is on record, else by name. Jersey numbers aren't reused within our own
// roster, so this is stable across sources for current players; imported
// guest/support players who have no number on file merge by name instead.
function battingKey(r){ return r.number ? ("num:"+r.number) : ("name:"+(r.name||"")); }

// Combine any number of raw-counting-stat row lists (e.g. an imported
// season snapshot plus the live-tracked games for that same season) into
// one list, summing counts per player — raw counts only, no rate stats.
// Split out of mergeBattingLists so seasonBattingFor can fold in an
// opponent-pool baseline before deriving rates once.
function mergeBattingListsRaw(...lists){
  const rows = {};
  lists.forEach(list=>{
    (list||[]).forEach(r=>{
      const key = battingKey(r);
      if (!rows[key]) rows[key] = {number:r.number||"", name:r.name||"", PA:0,AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,SF:0,RBI:0,R:0,K:0,DP:0,E:0};
      const row = rows[key];
      BATTING_COUNT_FIELDS.forEach(f=>{ row[f] += r[f]||0; });
      if (!row.name && r.name) row.name = r.name;
    });
  });
  return Object.values(rows);
}
function mergeBattingLists(...lists){
  return deriveBattingRates(mergeBattingListsRaw(...lists));
}

// Result/zone/type breakdown for one side ("us" or "opp"). For "opp" the
// `filterValue` is by opponent team name (game-level) and the optional
// `numberFilter` narrows further to one opposing jersey number (play-level);
// for "us" `filterValue` is our own player's jersey number (opponent name
// doesn't mean anything for our own batting, so `numberFilter` is unused).
// `numberFilter` is a composite "球隊||背號" key (see oppRowKey) — jersey
// numbers repeat across different opponent teams, so a bare number is not
// enough to identify one real player; matching always checks the team too.
function computeZoneAnalysis(games, side, filterValue, numberFilter){
  const isOpp = side==="opp";
  const resultCounts = {}; RESULT_ORDER.forEach(c=>resultCounts[c]=0);
  const zoneCounts = {}; FIELD_ZONES.forEach(z=>zoneCounts[z.name]=0);
  // Per-zone breakdown beyond raw counts, so the zone diagram can also
  // show "that zone's batting average / slugging" rather than just how
  // often the ball went there. AB follows the same convention as
  // computeOpponentBatting: every result except BB/SF counts as an AB
  // (so FC/E/K/GO/FO/DP all count, matching standard scoring).
  const zoneStats = {}; FIELD_ZONES.forEach(z=>zoneStats[z.name]={count:0,AB:0,H:0,TB:0});
  const typeCounts = {}; BATTED_TYPES.forEach(t=>typeCounts[t]=0);
  let totalPlays=0;
  const gamesInvolved = new Set();
  const numFilterParts = (isOpp && numberFilter && numberFilter!=="全部") ? numberFilter.split("||") : null;
  games.forEach(g=>{
    if (isOpp && filterValue && filterValue!=="全部" && g.opponent!==filterValue) return;
    if (numFilterParts && g.opponent!==numFilterParts[0]) return;
    (g.plays||[]).forEach(p=>{
      if (p.side!==side) return;
      if (!isOpp && filterValue && filterValue!=="全部" && String(p.batterNumber||"")!==String(filterValue)) return;
      if (numFilterParts && String(p.batterNumber||"")!==numFilterParts[1]) return;
      totalPlays++;
      gamesInvolved.add(g.id);
      if (resultCounts[p.code]!=null) resultCounts[p.code]++;
      if (p.zone && zoneCounts[p.zone]!=null) zoneCounts[p.zone]++;
      if (p.zone && zoneStats[p.zone]){
        const zs = zoneStats[p.zone];
        zs.count++;
        const meta = RESULTS[p.code];
        if (meta && p.code!=="BB" && p.code!=="SF"){
          zs.AB++;
          if (meta.cat==="hit"){ zs.H++; zs.TB += meta.bases; }
        }
      }
      if (p.battedType && typeCounts[p.battedType]!=null) typeCounts[p.battedType]++;
    });
  });
  return {resultCounts, zoneCounts, zoneStats, typeCounts, totalPlays, gamesCount:gamesInvolved.size};
}

// Opponent batting, broken down by team + jersey number. Different
// opponent teams can (and do) reuse the same jersey number for a
// different real player, so rows are always keyed by team+number, never
// number alone — otherwise stats for two unrelated players would be
// silently merged together. Batters with no number recorded are grouped
// per-team into a "未填背號" bucket.
function computeOpponentBatting(games, opponentFilter){
  const filtered = (!opponentFilter || opponentFilter==="全部") ? games : games.filter(g=>g.opponent===opponentFilter);
  const rows = {};
  function ensure(team, num){
    const key = (team||"") + "||" + (num || "__none__");
    if (!rows[key]) rows[key] = {team:team||"", number:num||"", PA:0,AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,K:0,GO:0,FO:0,FC:0,E:0,SF:0,DP:0};
    return rows[key];
  }
  filtered.forEach(g=>{
    (g.plays||[]).forEach(p=>{
      if (p.side!=="opp") return;
      const r = ensure(g.opponent, p.batterNumber);
      r.PA++;
      if (p.code!=="BB" && p.code!=="SF") r.AB++;
      if (["1B","2B","3B","HR"].includes(p.code)){ r.H++; r[p.code]++; }
      ["BB","K","GO","FO","FC","E","SF","DP"].forEach(c=>{ if (p.code===c) r[c]++; });
    });
  });
  return Object.values(rows).sort((a,b)=>{
    if (a.team!==b.team) return (a.team||"").localeCompare(b.team||"", "zh-Hant");
    const an = a.number===""?Infinity:(Number(a.number)||Infinity);
    const bn = b.number===""?Infinity:(Number(b.number)||Infinity);
    return an-bn;
  });
}
// Composite key identifying one real opponent player uniquely across
// teams — pair with the row's team so a shared jersey number never
// collides between two different opponents.
function oppRowKey(r){ return (r.team||"")+"||"+(r.number||""); }

// Pooled opponent-side batting totals (no per-player/per-team breakdown)
// used as the extra baseline input to deriveBattingRates so a player's
// OPS+ is standardized against league-wide batting (our players' output
// plus every recorded opponent at-bat), not just our own team's own
// output. Walks every "opp"-side play across the given games — the same
// plays computeOpponentBatting reads — including imported historical
// opponent-log games (oppLogOnly), since those logs' plays are exactly
// the recorded opponent at-bats this is meant to pool in.
function computeOpponentTotals(games){
  const t = {AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,SF:0};
  (games||[]).forEach(g=>{
    (g.plays||[]).forEach(p=>{
      if (p.side!=="opp") return;
      if (p.code!=="BB" && p.code!=="SF") t.AB++;
      if (["1B","2B","3B","HR"].includes(p.code)){ t.H++; t[p.code]++; }
      if (p.code==="BB") t.BB++;
      if (p.code==="SF") t.SF++;
    });
  });
  return t;
}

// Batted-ball type breakdown as rates (GB%/LD%/FB%/FOUL%) rather than raw
// counts — the percentage of all recorded batted-ball types that were
// each kind, e.g. GB% = 滾地 count / (滾地+平飛+高飛+界外 count).
function battedTypeRateRows(typeCounts){
  const total = BATTED_TYPES.reduce((a,t)=>a+(typeCounts[t]||0),0);
  return BATTED_TYPES.map(t=>{
    const pct = total>0 ? fmtPct(typeCounts[t]||0, total) : "—";
    return `<tr><td class="name">${BATTED_TYPE_PCT_LABEL[t]}（${t}）</td><td class="tabular">${pct}</td></tr>`;
  }).join("");
}
function fmtPct(part, total){ return total>0 ? (100*part/total).toFixed(1)+"%" : "—"; }

// Blue (low) → yellow (mid) → red (high) heat-map color for t in [0,1].
function heatColor(t){
  t = Math.max(0, Math.min(1, t));
  let c1,c2,f;
  if (t<0.5){ c1=[59,130,246]; c2=[234,179,8]; f=t/0.5; }
  else { c1=[234,179,8]; c2=[239,68,68]; f=(t-0.5)/0.5; }
  const r=Math.round(c1[0]+(c2[0]-c1[0])*f);
  const gC=Math.round(c1[1]+(c2[1]-c1[1])*f);
  const b=Math.round(c1[2]+(c2[2]-c1[2])*f);
  return `rgb(${r},${gC},${b})`;
}

const ZONE_METRIC_OPTS = [["freq","擊球機率"],["avg","該落點打擊率"],["slg","該落點長打率"]];

// Button row for switching one zone-diagram instance's metric. `key`
// identifies the instance (AppState.ui.zoneMetric.<key>) so several
// diagrams on the same page (our own, opponent's, and the live in-game
// defensive-reference one) toggle independently of one another.
function zoneMetricToggleHTML(key){
  const m = (AppState.ui.zoneMetric && AppState.ui.zoneMetric[key]) || "freq";
  return `<div class="chip-picker zc-options" style="justify-content:center;margin-bottom:6px;">
    ${ZONE_METRIC_OPTS.map(([v,label])=>`<button type="button" class="chip ${m===v?'sel':''}" onclick="selectZoneMetric('${key}','${v}')">${label}</button>`).join("")}
  </div>`;
}
function selectZoneMetric(key, v){
  if (!AppState.ui.zoneMetric) AppState.ui.zoneMetric = {};
  AppState.ui.zoneMetric[key] = v;
  render();
}
// Convenience: metric toggle + the diagram itself for one instance.
function zoneDiagramBlock(key, zoneStats){
  const m = (AppState.ui.zoneMetric && AppState.ui.zoneMetric[key]) || "freq";
  return zoneMetricToggleHTML(key) + fieldDiagramCountsHTML(zoneStats, m);
}

// Read-only zone diagram driven by per-zone stats ({count,AB,H,TB} per
// FIELD_ZONES name — see computeZoneAnalysis). `metric` selects what's
// displayed/colored: "freq" = share of batted balls landing in that zone,
// "avg" = batting average on balls hit to that zone, "slg" = slugging on
// balls hit to that zone. Color is a blue→yellow→red heat scale relative
// to the other zones' values for the same metric; zones with no
// observations for avg/slg (no AB there yet) are shown neutral gray
// rather than colored low, since "no data" isn't the same as "low value".
function fieldDiagramCountsHTML(zoneStats, metric){
  metric = metric || "freq";
  zoneStats = zoneStats || {};
  const cx=150, cy=200;
  const zoneTotal = FIELD_ZONES.reduce((a,z)=>a+((zoneStats[z.name]&&zoneStats[z.name].count)||0),0);
  const vals = FIELD_ZONES.map(z=>{
    const zs = zoneStats[z.name] || {count:0,AB:0,H:0,TB:0};
    if (metric==="avg") return zs.AB>0 ? zs.H/zs.AB : null;
    if (metric==="slg") return zs.AB>0 ? zs.TB/zs.AB : null;
    return zs.count; // freq: 0 is a real, colorable value (never "no data")
  });
  const known = vals.filter(v=>v!=null);
  const vMin = known.length ? Math.min(...known) : 0;
  const vMax = known.length ? Math.max(...known) : 0;
  const wedges = FIELD_ZONES.map((z,i)=>{
    const v = vals[i];
    const isIn = z.row==="in";
    const r1 = isIn ? 20 : 100;
    const r2 = isIn ? 100 : 185;
    const d = fzWedgePath(cx,cy,r1,r2,z.a1,z.a2);
    // Infield wedges are much narrower near the middle of the band (they
    // all converge toward home plate), so two stacked lines of text at
    // the midpoint radius run into the neighboring wedge's text. Anchor
    // infield labels close to the wide OUTER edge of the band instead,
    // with smaller/tighter type, so each wedge's two lines fit within
    // its own arc width; outfield wedges have plenty of room already.
    const labelR = isIn ? (r2 - 14) : (r1+r2)/2;
    const [lx,ly] = fzPolar(cx,cy,labelR,(z.a1+z.a2)/2);
    let fill, valueLabel;
    if (v==null){
      fill = "var(--surface-2)";
      valueLabel = "—";
    } else {
      const t = vMax>vMin ? (v-vMin)/(vMax-vMin) : (vMax>0?1:0);
      fill = heatColor(t);
      valueLabel = metric==="freq" ? (zoneTotal>0 ? Math.round(100*v/zoneTotal)+"%" : "0%") : fmt3(v);
    }
    const labelStyle = "fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;stroke-linejoin:round;";
    const nameSize = isIn ? 8.5 : 11;
    const valueSize = isIn ? 9.5 : 13;
    const dy1 = isIn ? 4 : 6;
    const dy2 = isIn ? 6 : 9;
    return `<path d="${d}" class="fz-wedge" style="fill:${fill};"></path>
      <text x="${lx.toFixed(1)}" y="${(ly-dy1).toFixed(1)}" class="fz-label" text-anchor="middle" style="${labelStyle}font-size:${nameSize}px;">${z.name}</text>
      <text x="${lx.toFixed(1)}" y="${(ly+dy2).toFixed(1)}" class="fz-label" text-anchor="middle" style="${labelStyle}font-size:${valueSize}px;font-weight:900;">${valueLabel}</text>`;
  }).join("");
  const [fx1,fy1] = fzPolar(cx,cy,185,-45);
  const [fx2,fy2] = fzPolar(cx,cy,185,45);
  return `<svg viewBox="0 0 300 205" class="field-svg field-svg-lg">
    ${wedges}
    <line x1="${cx}" y1="${cy}" x2="${fx1.toFixed(1)}" y2="${fy1.toFixed(1)}" class="fz-foul"/>
    <line x1="${cx}" y1="${cy}" x2="${fx2.toFixed(1)}" y2="${fy2.toFixed(1)}" class="fz-foul"/>
    <path d="M ${fx1.toFixed(1)} ${fy1.toFixed(1)} A 185 185 0 0 1 ${fx2.toFixed(1)} ${fy2.toFixed(1)}" class="fz-fence"/>
    <circle cx="${cx}" cy="${cy}" r="4" class="fz-home"/>
  </svg>`;
}

async function goStats(){
  AppState.games = await Store.listGames();
  AppState.seasonStats.season_2025 = await Store.getSeasonStats("season_2025");

async function saveLeagueGamesBatch(){
  const $ = id => document.getElementById(id);
  const rows = [];
  for (let i=0; i<LEAGUE_GAME_BATCH_ROWS; i++){
    const teamA = ($(`lgTeamA${i}`).value||"").trim();

// Which season a game counts toward. Games recorded before this field
// existed have no `season` — back then the app always folded live games
// into "2025-2026聯賽" (the season that was current at the time), so that
// stays the fallback for anything untagged rather than silently dropping
// those games from every season view.
function gameSeason(g){ return g.season || "2025-2026聯賽"; }
// Only "聯賽" (regular league) games — or games recorded before this
// field existed, which were all league games — count toward season/career
// totals. 盃賽 (cup) and 季後賽 (playoff) games are tracked separately
// (see the 盃賽／季後賽戰績 card) and excluded here.
function isLeagueGame(g){ return !g.competitionType || g.competitionType==="聯賽"; }

// Season dropdown options: the known seasons (always shown, in a stable
// order) plus any other season label actually present on a league game
// (e.g. a typo'd or one-off label), appended afterward.
function seasonOptionsFor(games){
  const found = new Set((games||[]).filter(g=>!g.oppLogOnly && isLeagueGame(g)).map(gameSeason));
  const extra = Array.from(found).filter(s=>!KNOWN_SEASONS.includes(s)).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  return [...KNOWN_SEASONS, ...extra];
}

// Our own team's batting line for one season/career view. A season with
// imported spreadsheet data (see SEASON_IMPORT_KEYS) starts from that,
// then adds whatever this app has itself tracked live and tagged with
// that same season label — the app is the go-forward scorekeeper once a
// season is underway. "生涯" (career) sums every league season together
// (imported + all live league games, regardless of which season each is
// tagged with). Non-league (盃賽/季後賽) games are never included here.
//
// OPS+ is standardized against a league-wide baseline: our own players'
// combined line PLUS every recorded opponent at-bat for the same
// season/career scope (from live games' "opp"-side plays, and from
// imported opponent-log games such as g_opp01–g_opp08 — those have no
// `season` field of their own and fall under gameSeason()'s existing
// "2025-2026聯賽" fallback, same as any other untagged league game). Our
// own team's counting totals still exclude oppLogOnly games (those are
// opponent stat logs, not games we actually played), but the opponent
// pool deliberately includes them, since their plays ARE real recorded
// opponent at-bats.
function seasonBattingFor(seasonKey, games){
  const leagueGames = (games||[]).filter(g=>!g.oppLogOnly && isLeagueGame(g));
  const oppPoolGames = (games||[]).filter(isLeagueGame);
  if (seasonKey==="生涯"){
    const imported = Object.values(SEASON_IMPORT_KEYS).flatMap(k=>AppState.seasonStats[k]||[]);
    const raw = mergeBattingListsRaw(imported, computeSeasonBattingRaw(leagueGames));
    return deriveBattingRates(raw, computeOpponentTotals(oppPoolGames));
  }
  const importKey = SEASON_IMPORT_KEYS[seasonKey];
  const imported = importKey ? (AppState.seasonStats[importKey]||[]) : [];
  const liveForSeason = computeSeasonBattingRaw(leagueGames.filter(g=>gameSeason(g)===seasonKey));
  const raw = mergeBattingListsRaw(imported, liveForSeason);
  const oppForSeason = oppPoolGames.filter(g=>gameSeason(g)===seasonKey);
  return deriveBattingRates(raw, computeOpponentTotals(oppForSeason));
}

// Batting totals for non-league games (盃賽/季後賽), optionally narrowed
// to one competition type ("盃賽"|"季後賽"|"全部"). Kept entirely separate
// from seasonBattingFor/生涯 per the team's request — cup and playoff
// results shouldn't skew regular-season career numbers.
function competitionBattingFor(competitionFilter, games){
  const filtered = (games||[]).filter(g=>!g.oppLogOnly && !isLeagueGame(g) &&
    (!competitionFilter || competitionFilter==="全部" || g.competitionType===competitionFilter));
  return computeSeasonBatting(filtered);
}

// Which of our players count as "on the roster" for a given season view
// (出席率／排行榜). For "生涯" this is just the full current roster, same
// as before this feature existed. For one specific season, a current
// squad member who wasn't actually part of the team that season (joined
// later, or simply didn't play) is left out entirely rather than shown
// with 0 attendance — membership is decided by whether they appear in
// that season's imported spreadsheet data (the season's authoritative
// roster, when one was imported) or in any game (any competition type)
// tagged with that season.
function rosterForSeason(seasonKey, games){
  if (!seasonKey || seasonKey==="生涯") return AppState.roster;
  const nums = new Set();
  const importKey = SEASON_IMPORT_KEYS[seasonKey];
  if (importKey){
    (AppState.seasonStats[importKey]||[]).forEach(r=>{ if (r.number) nums.add(String(r.number)); });
  }
  (games||[]).forEach(g=>{
    if (g.oppLogOnly || gameSeason(g)!==seasonKey) return;
    (g.lineup||[]).forEach(r=>{ if (r.number) nums.add(String(r.number)); });
    (g.bench||[]).forEach(b=>{ if (b.number) nums.add(String(b.number)); });
    (g.plays||[]).forEach(p=>{ if (p.side==="us" && p.batterNumber) nums.add(String(p.batterNumber)); });
  });
  return AppState.roster.filter(p=>nums.has(String(p.number)));
}

// Imported historical attendance (出賽次數), where available, per jersey
// number — see team/season_2025, team/season_2025_2026's `GP` field
// (Version 23). Without this, a closed/imported season's attendance
// count would only ever reflect games actually recorded as documents in
// this App — which for "2025" and "2025-2026聯賽" is almost none, since
// those seasons were mostly tracked as spreadsheet/paper records instead
// (see SEASON_GAME_COUNTS) — so every player's attendance for those
// seasons, and therefore for "生涯" too, would silently read as ~0
// regardless of how much they actually played. `GP` was backfilled from
// the team's own attendance tracking for exactly the players it covers;
// anyone not covered is simply left alone (falls back to whatever this
// App has actually recorded, same as before this field existed).
function importedAttendance(seasonKey){
  const importKey = SEASON_IMPORT_KEYS[seasonKey];
  const rows = importKey ? (AppState.seasonStats[importKey]||[]) : [];
  const out = {};
  rows.forEach(r=>{ if (r.number!=null && r.GP!=null) out[String(r.number)] = r.GP; });
  return out;
}

/* ---------- Pitching season/career query (投手成績查詢) ---------- */
const PITCHING_COUNT_FIELDS = ["K","BB","R","outs"];

// W (勝投) and G (出賽) aren't per-play counting stats like K/BB/R/outs, so
// they're derived separately rather than via PITCHING_COUNT_FIELDS: G is
// one per game a pitcher has any row in computePitching(g) (i.e. they threw
// a pitch, or have a manual override for that game — see computePitching),
// and W is one per game where that pitcher is recorded as g.finalWinPitcher
// (set from the 結束比賽 flow). Both count only games actually recorded in
// this App — see seasonPitchingFor for how imported historical W/G (when
// available) gets merged in on top of this.
function computeSeasonPitching(games){
  const rows = {};
  function ensure(num,name){
    if (!rows[num]) rows[num] = {number:num,name,K:0,BB:0,R:0,outs:0,W:0,G:0};
    return rows[num];
  }
  games.forEach(g=>{
    computePitching(g).forEach(gr=>{
      const r = ensure(gr.number, gr.name);
      PITCHING_COUNT_FIELDS.forEach(f=>{ r[f] += gr[f]||0; });
      r.G++;
    });
    if (g.finalWinPitcher && g.finalWinPitcher.number){
      const num = String(g.finalWinPitcher.number);
      const r = ensure(num, g.finalWinPitcher.name || rosterLookup(num) || ("#"+num));
      r.W++;
    }
  });
  return Object.values(rows);
}

// Unlike batting, pitching historically had no imported per-season source
// in this App — until the 2025 season's 勝投／登板 (W/G) columns were
// backfilled from the team spreadsheet (see team/season_2025's `rows`,
// which now carry W/G alongside the batting counting stats on each
// player's row — same source row, just extra fields). K/BB/R/outs are
// still never imported (the spreadsheet never tracked those per pitcher),
// so those always come entirely from games recorded in this App.
// "2025-2026聯賽" has NO imported W/G: the spreadsheet tab covering that
// season's second half is missing from the current file (its batting PA
// no longer add up to what's already imported — see app changelog), so
// backfilling W/G for it from the same source would be unreliable; that
// season's W/G counts only what this App has itself recorded going
// forward. Scoped the same way as batting: only league (聯賽) games/rows
// count toward season/career; 盃賽／季後賽 are excluded (no separate
// pitching card for those, unlike batting's 盃賽／季後賽戰績 — can be added
// later if asked).
function importedPitchingWG(rows){
  return (rows||[]).filter(r=>r.W!=null || r.G!=null)
    .map(r=>({number:r.number, name:r.name, W:r.W||0, G:r.G||0}));
}
function mergePitchingLists(...lists){
  const rows = {};
  lists.forEach(list=>{
    (list||[]).forEach(r=>{
      const key = battingKey(r);
      if (!rows[key]) rows[key] = {number:r.number||"", name:r.name||"", K:0,BB:0,R:0,outs:0,W:0,G:0};
      const row = rows[key];
      PITCHING_COUNT_FIELDS.concat(["W","G"]).forEach(f=>{ row[f] += r[f]||0; });
      if (!row.name && r.name) row.name = r.name;
    });
  });
  return Object.values(rows);
}
function seasonPitchingFor(seasonKey, games){
  const leagueGames = (games||[]).filter(g=>!g.oppLogOnly && isLeagueGame(g));
  if (seasonKey==="生涯"){
    const importedWG = Object.values(SEASON_IMPORT_KEYS).flatMap(k=>importedPitchingWG(AppState.seasonStats[k]));
    return mergePitchingLists(importedWG, computeSeasonPitching(leagueGames));
  }
  const importKey = SEASON_IMPORT_KEYS[seasonKey];
  const importedWG = importKey ? importedPitchingWG(AppState.seasonStats[importKey]) : [];
  const live = computeSeasonPitching(leagueGames.filter(g=>gameSeason(g)===seasonKey));
  return mergePitchingLists(importedWG, live);
}

}
