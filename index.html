const PITCHING_TABLE_HEAD = `<tr><th>投手</th><th>局數</th><th>三振</th><th>保送</th><th>失分</th><th>勝投</th><th>出賽</th></tr>`;

/* ---------- Team win/tie/loss record (球隊戰績) ---------- */
function sumArr(arr){ return (arr||[]).reduce((a,b)=>a+(b||0),0); }
function usScoreOf(g){ const ls=g.linescore||{top:[],bottom:[]}; return sumArr(g.batFirst?ls.top:ls.bottom); }
function oppScoreOf(g){ const ls=g.linescore||{top:[],bottom:[]}; return sumArr(g.batFirst?ls.bottom:ls.top); }

// Our team's win/tie/loss record — and breakdown by opponent — computed
// directly from games recorded in this App (real opponent + real score for
// every game, so this is exact, unlike the imported historical standings
// below which only ever have an aggregate weekly result with no opponent
// attached). Unlike seasonBattingFor, 盃賽／季後賽 games ARE includable here
// (via competitionFilter) since a win/loss record doesn't have the "skews
// career batting average" problem that kept cup/playoff out of career
// totals — a cup win is still a win.
function teamRecordFromGames(games, seasonKey, competitionFilter){
  const filtered = (games||[]).filter(g=>{
    if (g.oppLogOnly || g.status!=="final") return false;
    if (seasonKey && seasonKey!=="生涯" && gameSeason(g)!==seasonKey) return false;
    if (competitionFilter && competitionFilter!=="全部" && (g.competitionType||"聯賽")!==competitionFilter) return false;
    return true;
  });
  let W=0,T=0,L=0,RF=0,RA=0;
  const byOpp = {};
  const gameRows = [];
  filtered.forEach(g=>{
    const us = usScoreOf(g), opp = oppScoreOf(g);
    RF+=us; RA+=opp;
    const res = us>opp ? "勝" : (us<opp ? "敗" : "和");
    if (res==="勝") W++; else if (res==="敗") L++; else T++;
    if (!byOpp[g.opponent]) byOpp[g.opponent] = {team:g.opponent,W:0,T:0,L:0,RF:0,RA:0};
    const r = byOpp[g.opponent];
    if (res==="勝") r.W++; else if (res==="敗") r.L++; else r.T++;
    r.RF+=us; r.RA+=opp;
    gameRows.push({date:g.date, opponent:g.opponent, us, opp, result:res, competitionType:g.competitionType||"聯賽"});
  });
  gameRows.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const byOpponent = Object.values(byOpp).sort((a,b)=> (b.W-b.L)-(a.W-a.L) || a.team.localeCompare(b.team,"zh-Hant"));
  return {W,T,L,points:W*2+T,RF,RA,byOpponent,games:gameRows};
}

// Win/tie/loss counts from an imported historical row's ordered "勝"/"和"/
// "敗" sequence (may be empty — see TEAM_RECORD_IMPORT_KEYS).
function deriveWTLFromResults(results){
  const out = {W:0,T:0,L:0};
  (results||[]).forEach(r=>{ if (r==="勝") out.W++; else if (r==="和") out.T++; else if (r==="敗") out.L++; });
  return out;
}

// Standard CPBL-style win rate: 勝／(勝+敗) — ties are excluded from both
// numerator and denominator (a tie neither helps nor hurts win rate).
function winRate(w,l){ return (w+l)>0 ? w/(w+l) : 0; }

// Manually-entered results for games between two OTHER teams (see
// Store.getLeagueGames/saveLeagueGames) — filtered by season/賽事類別
// the same way teamRecordFromGames filters this app's own games, so the
// two sources combine consistently under one 球季／賽事類別 selection.
function filterLeagueGames(leagueGames, seasonKey, competitionFilter){
  return (leagueGames||[]).filter(lg=>{
    if (seasonKey && seasonKey!=="生涯" && (lg.season||SEASON_DEFAULT)!==seasonKey) return false;
    if (competitionFilter && competitionFilter!=="全部" && (lg.competitionType||"聯賽")!==competitionFilter) return false;
    return true;
  });
}

// A real multi-team standings table for the CURRENT (or any future)
// season, built by combining what this app already knows exactly (our
// own games, via teamRecordFromGames) with manually-entered results for
// games between two other teams. Returns null when there are no
// other-team entries in scope — the caller then falls back to just
// showing our own team's single-row record (see renderStatsView), since
// a real standings table needs to know how every OTHER team did too, not
// only how they did against us. Unlike the one-time imported historical
// standings (TEAM_RECORD_IMPORT_KEYS), this recomputes from scratch every
// time — new results (ours or manually-entered) instantly reflect in an
// up-to-date ranking, with no separate "re-import" step ever needed.
function computeFullStandings(games, leagueGames, seasonKey, competitionFilter){
  const otherGames = filterLeagueGames(leagueGames, seasonKey, competitionFilter);
  if (!otherGames.length) return null;
  const live = teamRecordFromGames(games, seasonKey, competitionFilter);
  const table = {};
  function ensure(team){
    if (!table[team]) table[team] = {team, W:0, T:0, L:0, RF:0, RA:0};
    return table[team];
  }
  const us = ensure("振宇五金");
  us.W=live.W; us.T=live.T; us.L=live.L; us.RF=live.RF; us.RA=live.RA;
  // Each opponent's record vs us is just our own byOpponent row, mirrored.
  live.byOpponent.forEach(o=>{
    const opp = ensure(o.team);
    opp.W+=o.L; opp.T+=o.T; opp.L+=o.W; opp.RF+=o.RA; opp.RA+=o.RF;
  });
  otherGames.forEach(lg=>{
    const a = ensure(lg.teamA), b = ensure(lg.teamB);
    const sa = Number(lg.scoreA)||0, sb = Number(lg.scoreB)||0;
    a.RF+=sa; a.RA+=sb; b.RF+=sb; b.RA+=sa;
    if (sa>sb){ a.W++; b.L++; } else if (sa<sb){ a.L++; b.W++; } else { a.T++; b.T++; }
  });
  const rows = Object.values(table).map(r=>({...r, games:r.W+r.T+r.L, points:r.W*2+r.T, rate:winRate(r.W,r.L)}));
  rows.sort((x,y)=> y.points-x.points || y.rate-x.rate || x.team.localeCompare(y.team,"zh-Hant"));
  rows.forEach((r,i)=>{ r.rank=i+1; });
  return rows;
}

// A single stat line for one of our players, by jersey number — falls
// back to an all-zero row (using the roster name) so the career-query
// selector can include players who haven't recorded a single play yet
// (or, for a specific season, didn't appear in that season at all).
function statsRowFor(battingList, number){
  const found = battingList.find(r=>r.number===number);
  if (found) return found;
  const name = rosterLookup(number) || "";
  return {number,name,PA:0,AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,SF:0,RBI:0,R:0,K:0,DP:0,E:0,AVG:0,OBP:0,SLG:0,OPS:0,ISO:0,OPSPlus:0};
}
function battingRowHTML(r){
  return `<tr>
    <td class="name">${r.number?'#'+esc(r.number)+' ':''}${esc(r.name)}</td>
    <td class="tabular">${r.PA}</td><td class="tabular">${r.AB}</td><td class="tabular">${r.H}</td>
    <td class="tabular">${fmt3(r.AVG)}</td><td class="tabular">${fmt3(r.OBP)}</td><td class="tabular">${fmt3(r.SLG)}</td><td class="tabular">${fmt3(r.OPS)}</td><td class="tabular">${fmt3(r.ISO)}</td><td class="tabular">${(r.OPSPlus||0).toFixed(1)}</td>
    <td class="tabular">${r["1B"]}</td><td class="tabular">${r["2B"]}</td><td class="tabular">${r["3B"]}</td><td class="tabular">${r.HR}</td>
    <td class="tabular">${r.BB}</td><td class="tabular">${r.SF}</td><td class="tabular">${r.RBI}</td><td class="tabular">${r.R}</td><td class="tabular">${r.K}</td><td class="tabular">${r.DP}</td><td class="tabular">${r.E}</td>
  </tr>`;
}
const BATTING_TABLE_HEAD = `<tr><th>球員</th><th>打席</th><th>打數</th><th>安打</th><th>打擊率</th><th>上壘率</th><th>長打率</th><th>OPS</th><th>ISO</th><th>OPS+</th><th>1B</th><th>2B</th><th>3B</th><th>HR</th><th>BB</th><th>SF</th><th>打點</th><th>得分</th><th>K</th><th>DP</th><th>失誤</th></tr>`;

async function goAttendance(){
  AppState.games = await Store.listGames();
  AppState.seasonStats.season_2025 = await Store.getSeasonStats("season_2025");
  AppState.seasonStats.season_2025_2026 = await Store.getSeasonStats("season_2025_2026");
  AppState.view="attendance"; render();
}
function selectAttendanceSeason(v){ AppState.ui.attendanceSeasonFilter=v; render(); }
function renderAttendanceView(){
  const allGames = AppState.games||[];
  const seasonFilter = AppState.ui.attendanceSeasonFilter || "生涯";
  const seasonOptions = seasonOptionsFor(allGames);
  // Exclude imported opponent-only aggregate logs (oppLogOnly) — they're
  // not real games we played, so they must not count toward attendance.
  // Attendance counts every game we actually fielded a team for
  // (league／盃賽／季後賽 alike) — unlike the career/season batting totals,
  // showing up for a cup game still counts as showing up.
  const games = allGames.filter(g=>!g.oppLogOnly && (seasonFilter==='生涯' || gameSeason(g)===seasonFilter));
  // For a closed/imported season (see SEASON_GAME_COUNTS), `games.length`
  // alone badly undercounts — those 24-game seasons mostly aren't
  // individual documents in this app, only their final W/T/L got
  // imported. totalGamesForScope substitutes the season's known real
  // total in that case (still just games.length for the current/any
  // other season, where every game really is a document here).
  const totalGames = totalGamesForScope(seasonFilter, games, allGames);
  const attendance = {};
  // Who this App shows as "present" for one game document (lineup／備補／
  // any recorded plate appearance).
  function presentInGame(g){
    const present = new Set();
    (g.lineup||[]).forEach(r=>{ if (r.number) present.add(r.number); });
    (g.bench||[]).forEach(b=>{ if (b.number) present.add(b.number); });
    (g.plays||[]).forEach(p=>{ if (p.side==="us" && p.batterNumber) present.add(p.batterNumber); });
    return present;
  }
  // ⚠️ Version 47 更新：聯賽比賽常常一天排兩場（雙重賽），但球員換人上場/
  // 記錄疏漏，常常只有其中一場的先發打線／備補名單／打席記到某位球員，
  // 另一場漏記。使用者要求「出席場數不要以有沒有上場（判斷單場的記錄）
  // 為準，只要當天兩場其中一場有出賽紀錄，就兩場都算出席」——同一天的
  // 兩場只要有出席任一場，就把那天所有場次都算進出席數，不是只算實際
  // 被記到名單/打席的那一場。只對「聯賽」比賽、且日期是真正的
  // yyyy-mm-dd（`f-date` 欄位存的格式）才做這個「同天合併」；試算表匯入
  // 的歷史比賽（`g_hist01`/`g_hist02` 之類）日期只是球季名稱的佔位字串
  // （例如「2026 賽季」），不是真正日期，好幾場完全不相關的比賽可能共用
  //同一個佔位字串，硬要用日期分組會把不相關的比賽誤判成同一天，所以那
  // 些完全不受影響，維持原本「單場各自認定出席」的算法；盃賽／季後賽同
  // 理不分組（目前沒聽說盃賽也一天排兩場，之後真的有的話再擴大範圍）。
  const REAL_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const sameDayGroups = {};
  const ungroupedGames = [];
  games.forEach(g=>{
    if (isLeagueGame(g) && REAL_DATE_RE.test(g.date||"")){
      (sameDayGroups[g.date] = sameDayGroups[g.date]||[]).push(g);
    } else {
      ungroupedGames.push(g);
    }
  });
  // ⚠️ Version 49 更新：使用者確認 g_hist01（vs 奕郝）／g_hist02（vs 零壹
  // 通訊）這兩場試算表匯入的歷史比賽，其實是同一天真正打的雙重賽——但它們
  // 的 date 都只是球季佔位字串「2026 賽季」（見上方 Version 47 註解），套
  // 不到「真正 yyyy-mm-dd 日期才分組」的規則。這兩筆是固定、不會再變動的
  // 歷史資料（試算表匯入的單場比賽紀錄本來就只有這兩筆，見 Version 40），
  // 不需要放寬日期比對規則去處理「未來還有其他這種資料」的情況，所以直接
  // 用固定的比賽 ID 名單手動標記為同一組雙重賽，其餘仍套用日期比對規則。
  const MANUAL_DOUBLEHEADER_GROUPS = [
    ["g_hist01", "g_hist02"],
  ];
  const manualGroups = [];
  MANUAL_DOUBLEHEADER_GROUPS.forEach(ids=>{
    const found = ids.map(id=>ungroupedGames.find(g=>g.id===id)).filter(Boolean);
    if (found.length>1){
      manualGroups.push(found);
      found.forEach(g=>{ const idx=ungroupedGames.indexOf(g); if (idx>=0) ungroupedGames.splice(idx,1); });
    }
  });
  Object.values(sameDayGroups).concat(manualGroups).forEach(dayGames=>{
    const presentThatDay = new Set();
    dayGames.forEach(g=>{ presentInGame(g).forEach(num=>presentThatDay.add(num)); });
    presentThatDay.forEach(num=>{ attendance[num]=(attendance[num]||0)+dayGames.length; });
  });
  ungroupedGames.forEach(g=>{
    presentInGame(g).forEach(num=>{ attendance[num]=(attendance[num]||0)+1; });
  });
  // Layer in imported historical attendance (see importedAttendance)
  // on top of whatever this App has actually recorded — for "生涯" every
  // imported season contributes, for one specific season only that
  // season's own import (if any). The two sources never overlap in
  // practice (an imported season has essentially no game documents of
  // its own), so this is a plain add, not a max/dedupe.
  const importedSeasonKeys = seasonFilter==='生涯' ? Object.keys(SEASON_IMPORT_KEYS) : [seasonFilter];
  importedSeasonKeys.forEach(sk=>{
    const imp = importedAttendance(sk);
    Object.keys(imp).forEach(num=>{ attendance[num] = (attendance[num]||0) + imp[num]; });
  });
  // For a specific season, only list players who were actually part of
  // that season (imported spreadsheet roster, or appeared in a game
  // tagged with that season) — a current squad member who joined later
  // shouldn't show up with a misleading 0/24 for a season before their
  // time.
  const rosterRows = rosterForSeason(seasonFilter, allGames);
  const attendRows = rosterRows.map(p=>{
    const cnt = attendance[p.number]||0;
    return {number:p.number, name:p.name, games:cnt, rate: totalGames? cnt/totalGames : 0};
  }).sort((a,b)=> b.rate-a.rate || b.games-a.games);

  // Leaderboards follow the same season/生涯 scoping as 球員生涯查詢 —
  // league games only (盃賽／季後賽 excluded, imported historical rows
  // included where applicable) — so "season" means the same thing
  // everywhere in the app.
  const batting = seasonBattingFor(seasonFilter, allGames);
  // Minimum-PA qualification (like a batting title): players whose plate
  // appearances are below totalGames (attendance's totalGames, i.e. the
  // number of games already played in this season/生涯 scope, counting
  // every game fielded incl. 盃賽／季後賽) are excluded from all
  // leaderboards below, so a player with only a couple of PA can't top
  // the AVG/OPS list on a tiny sample. ⚠️ Version 46 更新：門檻從「總場數
  // 的 60%」改成「總場數（100%）」——使用者要求上榜條件改為「打席數 ≥
  // 已賽場次」，不再打折扣。
  const qualifyMinPA = totalGames;
  const qualified = batting.filter(r=>r.PA >= qualifyMinPA);
  const withAB = qualified.filter(r=>r.AB>0);
  // 勝投 is a pitching count stat, not a batting rate/count stat, so it
  // isn't put through the PA-based qualifyMinPA threshold above — any
  // pitcher who has actually appeared (G>0) for this season/生涯 scope
  // is eligible.
  const pitchingQualified = seasonPitchingFor(seasonFilter, allGames).filter(r=>r.G>0);
  const rankTable = (list, valueFn, label) => `
    <div style="flex:1;min-width:150px;">
      <div class="k" style="font-size:13px;color:var(--ink-dim);margin-bottom:4px;">${label}</div>
      <table class="stats"><tbody>
        ${list.slice(0,5).map((r,i)=>`<tr><td class="name">${i+1}. #${esc(r.number)} ${esc(r.name)}</td><td class="tabular">${valueFn(r)}</td></tr>`).join("") || '<tr><td style="color:var(--ink-dim);">尚無資料</td></tr>'}
      </tbody></table>
    </div>`;

  $app.innerHTML = `
    <div class="topbar"><div class="topbar-inner">
      <button class="icon-btn" onclick="backHome()">‹ 返回</button>
      <div class="brand" style="justify-content:center;"><span class="brand-mark" style="font-size:18px;">出席與排行榜</span></div>
      <span style="width:56px;"></span>
    </div></div>

    <div class="attendance-body">
    <div class="card">
      <div class="field" style="margin-bottom:0;max-width:220px;">
        <label>球季</label>
        <select onchange="selectAttendanceSeason(this.value)">
          <option ${seasonFilter==='生涯'?'selected':''}>生涯</option>
          ${seasonOptions.map(s=>`<option ${seasonFilter===s?'selected':''}>${esc(s)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <h2>排行榜</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        ${rankTable([...withAB].sort((a,b)=>b.AVG-a.AVG), r=>fmt3(r.AVG), "打擊率")}
        ${rankTable([...withAB].sort((a,b)=>b.OBP-a.OBP), r=>fmt3(r.OBP), "上壘率")}
        ${rankTable([...withAB].sort((a,b)=>b.OPS-a.OPS), r=>fmt3(r.OPS), "OPS")}
        ${rankTable([...withAB].sort((a,b)=>(b.OPSPlus||0)-(a.OPSPlus||0)), r=>(r.OPSPlus||0).toFixed(1), "OPS+")}
        ${rankTable([...qualified].sort((a,b)=>b.H-a.H), r=>r.H, "安打")}
        ${rankTable([...qualified].sort((a,b)=>b.RBI-a.RBI), r=>r.RBI, "打點")}
        ${rankTable([...pitchingQualified].sort((a,b)=>(b.W||0)-(a.W||0)), r=>r.W||0, "勝投")}
      </div>
    </div>

    <div class="card">
      <h2>出席率</h2>
      <div class="stat-table-wrap">
        <table class="stats">
          <thead><tr><th>球員</th><th>出席場數</th><th>出席率</th></tr></thead>
          <tbody>
            ${attendRows.map(r=>`<tr><td class="name">#${esc(r.number)} ${esc(r.name)}</td><td class="tabular">${r.games}/${totalGames}</td><td class="tabular">${(r.rate*100).toFixed(0)}%</td></tr>`).join("") || '<tr><td colspan="3" style="color:var(--ink-dim);">尚無資料</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    </div>
  `;
}

/* ---------- SCHEDULE (賽程表 — Version 48 新增) ---------- */
async function goSchedule(){
  AppState.schedule = await Store.getSchedule();
  AppState.games = await Store.listGames();
  AppState.view = "schedule";
  render();
}
function selectScheduleSeason(v){ AppState.ui.scheduleSeasonFilter = v; render(); }
// 賽程表的球季下拉選單：固定已知球季在前，賽程表裡實際出現、但不在固定清單
// 裡的球季名稱（例如未來新增的球季）附加在後，另外開頭放「全部」可以整份
// 賽程一起看（不分季）。
function scheduleSeasonOptionsFor(){
  const found = new Set((AppState.schedule||[]).map(s=>s.season).filter(Boolean));
  const extra = Array.from(found).filter(s=>!KNOWN_SEASONS.includes(s)).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  return [...KNOWN_SEASONS, ...extra];
}
// 一筆賽程（有對手的那種，備註列沒有對手不適用）是否已經有對應的比賽紀錄
// （同日期＋同對手），用來顯示「已完成／進行中／未開始」狀態，並決定要不要
// 顯示「開始這場」按鈕（已經開過的就不用再顯示）。
function scheduleEntryStatus(entry, games){
  const match = (games||[]).find(g=>!g.oppLogOnly && g.date===entry.date && g.opponent===entry.opponent);
  if (!match) return {label:"未開始", cls:"final", matched:false};
  return match.status==="final" ? {label:"已完成", cls:"final", matched:true} : {label:"進行中", cls:"live", matched:true};
}
function fmtScheduleTime(t){
  if (!t || t.length!==4) return "";
  return t.slice(0,2)+":"+t.slice(2);
}
function renderScheduleView(){
  const seasonFilter = AppState.ui.scheduleSeasonFilter || SEASON_DEFAULT;
  const seasonOptions = scheduleSeasonOptionsFor();
  const all = AppState.schedule || [];
  const list = all.filter(s=> seasonFilter==="全部" || s.season===seasonFilter)
    .slice()
    .sort((a,b)=> (a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
  const rows = list.map(s=>{
    const noteOnly = !s.opponent;
    const editBtns = `
      <button class="row-x" onclick="openScheduleModal('${s.id}')" title="編輯">✎</button>
      <button class="row-x" onclick="deleteScheduleEntry('${s.id}')" title="刪除">✕</button>`;
    if (noteOnly){
      return `<div class="game-item" style="cursor:default;opacity:.7;">
        <div class="gi-vs">
          <div class="gi-opp">${esc(s.date)}${s.time?` ${esc(fmtScheduleTime(s.time))}`:""}</div>
          <div class="gi-meta">${esc(s.note || "備註")}</div>
        </div>
        ${editBtns}
      </div>`;
    }
    const st = scheduleEntryStatus(s, AppState.games);
    return `<div class="game-item" style="cursor:default;">
      <div class="gi-vs">
        <div class="gi-opp">${esc(s.date)}${s.time?` ${esc(fmtScheduleTime(s.time))}`:""} · ${esc(s.venue||"")} · 振宇五金 <span style="color:var(--ink-dim);font-weight:400;">vs</span> ${esc(s.opponent)}</div>
        <div class="gi-meta">${s.batFirst===true?"先攻":s.batFirst===false?"先守":"攻守未定"}${s.note?` · ${esc(s.note)}`:""}</div>
      </div>
      <span class="status-pill ${st.cls}">${st.label}</span>
      ${st.matched ? "" : `<button class="btn primary" style="padding:6px 10px;font-size:12px;flex:none;" onclick="goSetupFromSchedule('${s.id}')">開始這場</button>`}
      ${editBtns}
    </div>`;
  }).join("");
  $app.innerHTML = `
    <div class="topbar"><div class="topbar-inner">
      <button class="icon-btn" onclick="backHome()">‹ 返回</button>
      <div class="brand" style="justify-content:center;"><span class="brand-mark" style="font-size:18px;">賽程表</span></div>
      <span style="width:56px;"></span>
    </div></div>
    <div class="card">
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <div class="field" style="margin-bottom:0;max-width:220px;flex:1;">
          <label>球季</label>
          <select onchange="selectScheduleSeason(this.value)">
            <option ${seasonFilter==='全部'?'selected':''}>全部</option>
            ${seasonOptions.map(s=>`<option ${seasonFilter===s?'selected':''}>${esc(s)}</option>`).join("")}
          </select>
        </div>
        <button class="btn primary" onclick="openScheduleModal()">＋ 新增賽程</button>
      </div>
    </div>
    <div class="card">
      ${rows || '<div class="empty-state"><div class="em">📅</div>這個球季還沒有賽程資料</div>'}
    </div>
    ${AppState.ui.showScheduleModal ? renderScheduleModal() : ""}
  `;
}

}
function setScheduleBatFirst(v){ AppState.ui.scheduleModalDraftBatFirst = v; render(); }

      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="sch-date" value="${esc(e.date)}">
      </div>
      <div class="field">
        <label>時間（選填，格式 HHMM，例：1400）</label>
        <input type="text" id="sch-time" inputmode="numeric" placeholder="例：1400" value="${esc(e.time||'')}">
      </div>
      <div class="field">
        <label>場地</label>
        <input type="text" id="sch-venue" value="${esc(e.venue||'')}">
      </div>
      <div class="field">
        <label>對手（留空＝只是備註列，如輪休／盃賽提醒）</label>
        <select id="sch-opp-select" onchange="onScheduleOppSelectChange(this.value)">
          <option value="" ${!e.opponent?'selected':''}>（無，只是備註列）</option>
          ${oppOptions.map(o=>`<option value="${esc(o)}" ${e.opponent===o?'selected':''}>${esc(o)}</option>`).join("")}
          <option value="__other__" ${isOtherOpp?'selected':''}>其他（自行輸入）</option>
        </select>
        <input type="text" id="sch-opp-custom" placeholder="輸入對手隊名" value="${esc(isOtherOpp?e.opponent:'')}" style="margin-top:6px;${isOtherOpp?'':'display:none;'}">
      </div>
      <div class="field">
        <label>攻守順序</label>
        <div class="seg">
          <button class="${batFirst===true?'active':''}" onclick="setScheduleBatFirst(true)">先攻</button>
          <button class="${batFirst===false?'active':''}" onclick="setScheduleBatFirst(false)">先守</button>
          <button class="${batFirst==null?'active':''}" onclick="setScheduleBatFirst(null)">未定</button>
        </div>
      </div>
      <div class="field">
        <label>備註</label>
        <input type="text" id="sch-note" value="${esc(e.note||'')}" placeholder="例：輪休／延賽／盃賽提醒">
      </div>
      <button class="btn primary block" onclick="saveScheduleEntry()">儲存</button>
      ${editing ? `<button class="btn block" style="margin-top:8px;color:var(--danger);" onclick="deleteScheduleEntry('${editing.id}')">刪除此筆</button>` : ``}
    </div>
  </div>`;
}
async function saveScheduleEntry(){
  if (!requireAdmin("編輯賽程")) return;
  const $ = id=>document.getElementById(id);
  const season = $("sch-season").value.trim() || SEASON_DEFAULT;
  const date = $("sch-date").value || todayStr();
  const time = $("sch-time").value.trim();
  const venue = $("sch-venue").value.trim();
  const oppSel = $("sch-opp-select").value;
  const oppCustom = $("sch-opp-custom").value.trim();
  const opponent = oppSel==="__other__" ? oppCustom : oppSel;
  const batFirst = AppState.ui.scheduleModalDraftBatFirst;
  const note = $("sch-note").value.trim();
  const editId = AppState.ui.scheduleModalEditId;
  const row = { id: editId || ("sch_"+uid()), season, date, time, venue, opponent, batFirst, note };
  AppState.schedule = AppState.schedule || [];
  const idx = editId ? AppState.schedule.findIndex(s=>s.id===editId) : -1;
  if (idx>=0) AppState.schedule[idx] = row; else AppState.schedule.push(row);
  await Store.saveSchedule(AppState.schedule);
  AppState.ui.showScheduleModal = false;
  AppState.ui.scheduleModalEditId = null;
  render();
}
async function deleteScheduleEntry(id){
  if (!requireAdmin("刪除賽程")) return;
  if (!(await appConfirm("刪除這筆賽程？"))) return;
  AppState.schedule = (AppState.schedule||[]).filter(s=>s.id!==id);
  await Store.saveSchedule(AppState.schedule);
  AppState.ui.showScheduleModal = false;
  AppState.ui.scheduleModalEditId = null;
  render();
}

/* ---------- Field diagram (batted-ball landing spot) ---------- */
function fzPolar(cx,cy,r,angDeg){
  const a = angDeg*Math.PI/180;
  return [cx + r*Math.sin(a), cy - r*Math.cos(a)];
}
function fzWedgePath(cx,cy,r1,r2,a1,a2){
  const [ix1,iy1]=fzPolar(cx,cy,r1,a1);
  const [ix2,iy2]=fzPolar(cx,cy,r1,a2);
  const [ox1,oy1]=fzPolar(cx,cy,r2,a1);
  const [ox2,oy2]=fzPolar(cx,cy,r2,a2);
  return `M ${ix1.toFixed(1)} ${iy1.toFixed(1)} L ${ox1.toFixed(1)} ${oy1.toFixed(1)} `+
    `A ${r2} ${r2} 0 0 1 ${ox2.toFixed(1)} ${oy2.toFixed(1)} L ${ix2.toFixed(1)} ${iy2.toFixed(1)} `+
    `A ${r1} ${r1} 0 0 0 ${ix1.toFixed(1)} ${iy1.toFixed(1)} Z`;
}
function fieldDiagramHTML(selected){
  const cx=150, cy=200;
  const wedges = FIELD_ZONES.map(z=>{
    const r1 = z.row==="in" ? 20 : 100;
    const r2 = z.row==="in" ? 100 : 185;
    const d = fzWedgePath(cx,cy,r1,r2,z.a1,z.a2);
    const [lx,ly] = fzPolar(cx,cy,(r1+r2)/2,(z.a1+z.a2)/2);
    const sel = selected===z.name;
    return `<path d="${d}" class="fz-wedge ${z.row} ${sel?'sel':''}" onclick="setZone('${z.name}')"></path>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" class="fz-label ${sel?'sel':''}" text-anchor="middle" dominant-baseline="middle">${z.name}</text>`;
  }).join("");
  const [fx1,fy1] = fzPolar(cx,cy,185,-45);
  const [fx2,fy2] = fzPolar(cx,cy,185,45);
  return `<svg viewBox="0 0 300 205" class="field-svg">
    ${wedges}
    <line x1="${cx}" y1="${cy}" x2="${fx1.toFixed(1)}" y2="${fy1.toFixed(1)}" class="fz-foul"/>
    <line x1="${cx}" y1="${cy}" x2="${fx2.toFixed(1)}" y2="${fy2.toFixed(1)}" class="fz-foul"/>
    <path d="M ${fx1.toFixed(1)} ${fy1.toFixed(1)} A 185 185 0 0 1 ${fx2.toFixed(1)} ${fy2.toFixed(1)}" class="fz-fence"/>
    <circle cx="${cx}" cy="${cy}" r="4" class="fz-home"/>
  </svg>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  // oppLogOnly entries are aggregated historical opponent-batting data
  // imported from the season spreadsheet (not a real single game we

  $app.innerHTML = `

async function openGame(id){
  const g = await Store.loadGame(id);
  if (!g) return;
  AppState.game = g;
  await Store.setActiveGameId(id);
  AppState.view = g.status==="setup" ? "lineup" : "game";
  render();
}

// Delete a game — no longer offered as a one-tap button on the home list
// (too easy to hit by accident); it's now only reachable after opening the
// game itself (in-progress games: via the 戰績 modal's 🗑 button, see
// renderBoxModal; finished games: via the button on the final-summary
// screen, see deleteFinishedGame/renderFinalSummary). A finished game is
// admin-gated (via games_final's write rule), an in-progress/erroneous one
// is not. If the game being deleted is the one currently open on screen,
// also clears it and returns to the home screen.
async function deleteGameFromList(id, status){
  if (!(await appConfirm("確定要刪除這場比賽紀錄嗎？此動作無法復原。"))) return;
  const wasFinal = status==="final";
  const res = await Store.deleteGame(id, wasFinal);
  if (res && res.ok===false){
    appAlert(wasFinal ? "只有管理員能刪除已完賽的紀錄。" : "刪除失敗，請稍後再試。");
    return;
  }
  const activeId = await Store.getActiveGameId();
  if (activeId===id) await Store.setActiveGameId(null);
  if (AppState.game && AppState.game.id===id){
    AppState.game = null;
    AppState.view = "home";
    AppState.ui.showBox = false;
  }
  AppState.games = await Store.listGames();
  render();
}

// Version 48 新增：開始新比賽時，對手隊名改用下拉選單（見使用者需求「讓我在
// 開始新比賽時直接以選單選對手球隊」），選項＝本季固定 8 支對手隊（見
// OPPONENT_TEAMS）聯集賽程表(AppState.schedule)裡實際出現過的其他對手名稱
// （避免未來加了新對手隊但沒回來改這裡的常數）。清單固定順序在前、額外名稱
// （依筆畫/字母排序）附加在後，跟 seasonOptionsFor() 的做法一致。
function opponentOptionsFor(){
  const found = new Set((AppState.schedule||[]).map(s=>s.opponent).filter(Boolean));
  const extra = Array.from(found).filter(o=>!OPPONENT_TEAMS.includes(o)).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  return [...OPPONENT_TEAMS, ...extra];
}
// DOM-only toggle（不呼叫 render()，才不會把使用者已經填好的其他欄位重置）：
// 選單選到「其他」才顯示自行輸入的文字欄位。
function onOppSelectChange(v){
  const custom = document.getElementById("f-opp-custom");
  if (!custom) return;
  if (v==="__other__"){ custom.style.display=""; custom.focus(); }
  else { custom.style.display="none"; }
}
async function goSetup(prefill){

  // 的「開始這場」快速開局，也會先帶好 opponent/batFirst/date 再呼叫這裡）。
  AppState.schedule = await Store.getSchedule();

// 備註列（沒有對手，如輪休／盃賽提醒）沒有對手可帶，點了沒作用。
async function goSetupFromSchedule(entryId){

  await goSetup({ opponent: entry.opponent, batFirst: entry.batFirst===true, date: entry.date });
}

// Resize the fixed opponent batting-order slot list (10 or 11 slots).
// Growing pads with blank rows; shrinking drops the trailing slots — if
// any of those being dropped actually had data in them, confirm first
// so a team doesn't lose a filled-in number/name by accident.
async function setOppBattingSlots(n){
  const g = AppState.game;
  const cur = g.oppRoster.length;
  if (n < cur){
    const dropped = g.oppRoster.slice(n);
    const hasData = dropped.some(b=>b.number||b.name);
    if (hasData && !(await appConfirm(`縮減為 ${n} 棒會清除第 ${n+1}～${cur} 棒已填的資料，確定要縮減嗎？`))) return;
    g.oppRoster = g.oppRoster.slice(0, n);
  } else {
    while (g.oppRoster.length < n) g.oppRoster.push({number:"", name:""});
  }
  g.oppBattingSlots = n;
  render();
}

async function startGame(){
  const g = AppState.game;
  const filled = g.lineup.filter(r=>r.number);
  if (filled.length < 1){ appAlert("請至少填入一位打者背號"); return; }
  g.lineup = g.lineup.filter(r=>r.number).map((r,idx)=>({...r, order:idx+1, name:rosterLookup(r.number)||("#"+r.number)}));
  g.status = "live";
  AppState.view = "game";
  syncOppBatter(g);
  await persistGame();
  await Store.setActiveGameId(g.id);
  render();
}

// While we're on defense, show the current opposing batter's historical
// zone tendencies (if any is on record) as a positioning reference — keyed
// by team+jersey number, same composite-key rule as the rest of the app's
// opponent analysis, since jersey numbers repeat across opponent teams.
// Renders nothing when there's no batter set yet or no data on file for
// them, so it doesn't clutter the fast-paced recording screen.
function oppDefenseZoneCardHTML(g){
  if (!g.oppNumber) return "";
  const key = g.opponent + "||" + g.oppNumber;
  const analysis = computeZoneAnalysis(gamesForZoneRef(), "opp", g.opponent, key);
  if (!analysis.totalPlays) return "";
  const m = (AppState.ui.zoneMetric && AppState.ui.zoneMetric.def) || "freq";
  return `<div class="card zc-card">
    <h2 class="zc-label">⚾ #${esc(g.oppNumber)}${g.oppNote?(' '+esc(g.oppNote)):''} 歷史落點分析</h2>
    <div class="zc-options">${zoneMetricToggleHTML('def')}</div>
    <div class="zc-diagram">${fieldDiagramCountsHTML(analysis.zoneStats, m)}</div>
    <div class="hint zc-label zc-hint-bottom">依過往對戰紀錄（共 ${analysis.gamesCount} 場、${analysis.totalPlays} 個打席）統計，僅供防守站位參考。顏色越紅代表該項數值越高，越藍代表越低；灰色代表該落點尚無資料。</div>
  </div>`;
}

function renderGame(){
  const g = AppState.game;
  if (g.status === "final") return renderFinalSummary();
  const weAreUp = isOurHalf(g);
  const halfLabel = g.inning + "局" + (g.half==="top"?"上":"下");
  const inningsToShow = Math.max(7, g.linescore.top.length, g.linescore.bottom.length, g.inning);

  // linescore header + rows
  let head = `<th></th>`;
  for (let i=1;i<=inningsToShow;i++) head += `<th>${i}</th>`;
  head += `<th>合計</th>`;
  function rowCells(arr){
    let c="";
    for (let i=0;i<inningsToShow;i++) c += `<td class="tabular">${arr[i]!=null?arr[i]:""}</td>`;
    return c;
  }
  const topIsUs = g.batFirst;
  const line = `
    <table class="linescore">
      <thead><tr>${head}</tr></thead>
      <tbody>

            </div>

function pickOppBatter(idx){
  const g = AppState.game;
  const b = g.oppRoster[idx];
  if (!b) return;
  g.oppBattingIdx = idx;
  g.oppNumber = b.number;
  g.oppNote = b.name;
  persistGame(); render();
}
// Manually correct/replace the opponent batter currently at the plate
// (e.g. the slot's number was never filled in before the game, or a
// pinch hitter just came in). Also writes the new number back into the
// current oppRoster slot so it "sticks" the next time this batting
// position comes around, not just for this one at-bat; the historical
// zone-analysis card (oppDefenseZoneCardHTML) keys off g.oppNumber and
// re-renders automatically, so no extra wiring is needed for it to pick
// up the new player's data right away.
function editOppBatterNumber(value){
  const g = AppState.game;
  g.oppNumber = (value||"").trim();
  if (g.oppRoster && g.oppRoster.length){
    const idx = (g.oppBattingIdx||0) % g.oppRoster.length;
    if (g.oppRoster[idx]) g.oppRoster[idx].number = g.oppNumber;
  }
  persistGame(); render();
}
function renderResultGrid(side){
  return `<div class="card">
    <div class="result-grid">
      ${RESULT_ORDER.map(code=>{
        const meta = RESULTS[code];
        const cls = meta.cat==="hit"?"hit":(meta.cat==="out"||meta.cat==="dp"||meta.cat==="sf"?"out":"reach");
        return `<button class="rbtn ${cls}" onclick="pickResult('${code}','${side}')">${code}<small>${meta.label}</small></button>`;
      }).join("")}
    </div>
  </div>`;
}

function pickResult(code, side){
  AppState.ui.pendingResult = {code, side};
  AppState.ui.pendingOuts = defaultOuts(code);
  AppState.ui.pendingRuns = 0;      // opp side only (simple count)
  AppState.ui.pendingScorers = [];  // us side only (array of lineup slot ids)
  AppState.ui.pendingRbi = 0;
  AppState.ui.pendingErrorBy = null;
  AppState.ui.pendingZone = null;
  AppState.ui.pendingType = null;
  render();
}

// Split from the original single renderConfirmBox() so the landscape
// 3-column layout can put the result/stepper/scorer fields in the middle

      <div class="chip-picker">
        ${g.lineup.filter(r=>r.position).map(r=>`<span class="chip ${p.pendingErrorBy===r.id?'sel':''}" onclick="setErrorBy('${r.id}')">${r.position} #${esc(r.number)} ${esc(r.name)}</span>`).join("") || '<span class="roster-hint">尚未設定守位</span>'}
      </div>
    </div>` : "";

  const scorerSection = (side==="us") ? `
    <div style="margin-top:8px;">
      <div class="k" style="font-size:13px;color:var(--ink-dim);margin-bottom:6px;">得分球員（可複選，本次得分 ${p.pendingScorers.length} 分）</div>
      <div class="chip-picker">
        ${scorerCandidates(g).map(r=>`<span class="chip ${p.pendingScorers.includes(r.id)?'sel':''}" onclick="toggleScorer('${r.id}')">#${esc(r.number)} ${esc(r.name)}（第${r.order}棒）</span>`).join("")}

  return `<div class="card">

      <div class="stepper"><button onclick="stepRuns(-1)">−</button><span class="val tabular">${p.pendingRuns}</span><button onclick="stepRuns(1)">＋</button></div>
    </div>` : ``}
    ${side==='us' ? `<div class="kv-row"><span class="k">打點 RBI</span>
      <div class="stepper"><button onclick="stepRbi(-1)">−</button><span class="val tabular">${p.pendingRbi}</span><button onclick="stepRbi(1)">＋</button></div>
    </div>` : ``}
    <div class="kv-row"><span class="k">出局數（本次）</span>
      <div class="stepper"><button onclick="stepOuts(-1)">−</button><span class="val tabular">${p.pendingOuts}</span><button onclick="stepOuts(1)">＋</button></div>

// Compact "先前打擊成績" reference panel: the current batter's plate
// appearances so far *this game*, so the scorer doesn't have to open the
// full 戰績 modal mid-play. Shown in gb-left (scoreboard column).
function recentBatterHistoryHTML(g, weAreUp){
  const side = weAreUp ? "us" : "opp";
  const batter = weAreUp ? (g.lineup[g.battingIdx % Math.max(1,g.lineup.length)] || {}) : null;
  const battingNumber = weAreUp ? batter.number : g.oppNumber;
  const battingName = weAreUp ? batter.name : (g.oppNote || "");
  const past = String(battingNumber||"").trim()
    ? (g.plays||[]).filter(p=>p.code && p.side===side && String(p.batterNumber||"")===String(battingNumber))
    : [];
  const chips = past.slice(-6).map(p=>{
    const meta = RESULTS[p.code] || {label:p.code, cat:""};
    const cls = meta.cat==="hit"?"hit":(meta.cat==="out"||meta.cat==="dp"||meta.cat==="sf"?"out":"reach");
    const halfCh = p.half==="top"?"上":"下";
    return `<span class="hist-chip ${cls}" title="${esc(meta.label)}">${p.inning}${halfCh}·${esc(p.code)}</span>`;
  }).join("");
  return `<div class="history-panel">
    <div class="hist-title">先前打擊成績${battingNumber?('　#'+esc(battingNumber)+(battingName?(' '+esc(battingName)):'')):''}</div>
    <div class="hist-chips">${chips || '<span class="roster-hint">本場尚無打席紀錄</span>'}</div>
  </div>`;
}

function stepRuns(d){ AppState.ui.pendingRuns = Math.max(0, AppState.ui.pendingRuns+d); render(); }
function stepRbi(d){ AppState.ui.pendingRbi = Math.max(0, AppState.ui.pendingRbi+d); render(); }
function stepOuts(d){ AppState.ui.pendingOuts = Math.max(0, Math.min(3, AppState.ui.pendingOuts+d)); render(); }
function setErrorBy(id){ AppState.ui.pendingErrorBy = id; render(); }
function setZone(z){ AppState.ui.pendingZone = (AppState.ui.pendingZone===z?null:z); render(); }
function setType(t){ AppState.ui.pendingType = (AppState.ui.pendingType===t?null:t); render(); }
function toggleScorer(id){
  const arr = AppState.ui.pendingScorers;
  const i = arr.indexOf(id);
  if (i>=0) arr.splice(i,1); else arr.push(id);
  render();
}
function cancelPending(){
  AppState.ui.pendingResult=null; render();
}

async function confirmPending(){
  const g = AppState.game;
  const p = AppState.ui;
  const side = p.pendingResult.side;
  const code = p.pendingResult.code;

  let batterNumber="", batterName="";
  if (side==="us"){
    const batterSlot = g.lineup[g.battingIdx % g.lineup.length];
    batterNumber = batterSlot.number; batterName = batterSlot.name;
  } else {
    batterNumber = g.oppNumber;
    batterName = g.oppNote || "";
  }

  const scorers = side==="us" ? p.pendingScorers.map(id=>{
    const sl = g.lineup.find(l=>l.id===id);
    return sl ? {number:sl.number, name:sl.name} : null;
  }).filter(Boolean) : [];
  const runsThisPlay = side==="us" ? scorers.length : p.pendingRuns;

  // ensure current inning column exists
  const half = g.half;
  const arr = g.linescore[half];
  while (arr.length < g.inning) arr.push(0);
  arr[g.inning-1] = (arr[g.inning-1]||0) + runsThisPlay;

  g.outs = Math.min(3, g.outs + p.pendingOuts);

  // Snapshot the actual pitcher (number/name), not just the lineup slot —
  // a slot's occupant can change via substitution, and stats must stay
  // attached to whoever actually pitched this particular play.
  const pitcherNow = side==="opp" ? currentPitcher(g) : null;

  // log the play
  g.plays.push({
    id: uid(), half, inning: g.inning, side, code,
    batterNumber, batterName,
    rbi: side==="us" ? p.pendingRbi : 0,
    runs: runsThisPlay,
    scorers: side==="us" ? scorers : undefined,
    outs: p.pendingOuts,
    errorBy: p.pendingErrorBy,
    zone: p.pendingZone,
    battedType: p.pendingType,
    pitcherId: pitcherNow ? pitcherNow.id : null,
    pitcherNumber: pitcherNow ? pitcherNow.number : null,
    pitcherName: pitcherNow ? pitcherNow.name : null,
    ts: Date.now(),
  });

  if (side==="us"){
    g.battingIdx = (g.battingIdx+1) % Math.max(1,g.lineup.length);
  } else if (g.oppRoster && g.oppRoster.length){
    g.oppBattingIdx = ((g.oppBattingIdx||0)+1) % g.oppRoster.length;
    syncOppBatter(g);
  }

  AppState.ui.pendingResult=null;
  await persistGame();
  render();
}

async function endHalfInning(){
  const g = AppState.game;
  g.outs = 0;
  if (g.half==="top"){
    g.half = "bottom";
  } else {
    g.half = "top";
    g.inning += 1;
  }
  if (!isOurHalf(g)) syncOppBatter(g);
  await persistGame();
  render();
}

async function undoLastPlay(){
  const g = AppState.game;
  if (!g.plays.length){ return; }
  if (!(await appConfirm("復原最後一筆紀錄？"))) return;
  const last = g.plays.pop();
  // roll back runs from linescore
  const arr = g.linescore[last.half];
  if (arr[last.inning-1]!=null) arr[last.inning-1] = Math.max(0, arr[last.inning-1]-last.runs);
  // roll back outs
  g.outs = Math.max(0, g.outs - last.outs);
  // roll back batter index / restore opponent batter fields for convenience
  if (last.side==="us"){
    g.battingIdx = (g.battingIdx - 1 + g.lineup.length) % Math.max(1,g.lineup.length);
  } else {
    if (g.oppRoster && g.oppRoster.length){
      g.oppBattingIdx = ((g.oppBattingIdx||0) - 1 + g.oppRoster.length) % g.oppRoster.length;
      syncOppBatter(g);
    } else {
      g.oppNumber = last.batterNumber || "";
      g.oppNote = last.batterName || "";
    }
  }
  persistGame(); render();
}

async function applySub(){
  const g = AppState.game;
  const i = AppState.ui.subTargetIdx;
  const target = g.lineup[i];

  if (AppState.ui.subType==='DEF' && AppState.ui.defMode==='swap'){
    const swapEl = document.getElementById("sub-field-swap");
    const j = swapEl ? parseInt(swapEl.value,10) : NaN;
    if (isNaN(j) || !g.lineup[j] || j===i){ appAlert("請選擇要互換守位的在場球員"); return; }
    const other = g.lineup[j];
    const aOldPos = target.position, bOldPos = other.position;
    g.plays.push({id:uid(), type:"posswap",
      half:g.half, inning:g.inning,
      aNumber:target.number, aName:target.name, aOldPos, aNewPos:bOldPos,
      bNumber:other.number, bName:other.name, bOldPos, bNewPos:aOldPos,
      ts:Date.now()});
    target.position = bOldPos;
    other.position = aOldPos;
    AppState.ui.subTargetIdx=null;
    await persistGame();
    render();
    return;
  }

  const numEl = document.getElementById("sub-bench-num");
  const posEl = document.getElementById("sub-pos");
  const newNum = numEl.value;
  if (!newNum){ appAlert("請選擇板凳球員"); return; }
  const bIdx = g.bench.findIndex(b=>b.number===newNum);
  const newName = bIdx>=0 ? g.bench[bIdx].name : rosterLookup(newNum);
  const newPos = posEl.value;
  if (newPos && g.lineup.some(r=>r.id!==target.id && r.position===newPos)){
    appAlert("「"+newPos+"」這個守位已經有球員擔任了，請先把該球員的守位改掉。");
    return;
  }

  g.plays.push({id:uid(), type:"sub", subType:AppState.ui.subType,
    half:g.half, inning:g.inning,
    oldNumber:target.number, oldName:target.name,
    newNumber:newNum, newName, ts:Date.now()});

  // move replaced starter to bench (so they can theoretically re-enter list visibility), add new player in
  if (bIdx>=0) g.bench.splice(bIdx,1);
  target.number = newNum;
  target.name = newName;
  target.position = newPos;

  AppState.ui.subTargetIdx=null;
  await persistGame();
  render();
}

/* ---------- Box score ---------- */
function computeBoxScore(game){
  const rows = {}; // key = number
  function ensure(num,name){
    if (!rows[num]) rows[num] = {number:num,name,PA:0,AB:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,BB:0,SF:0,RBI:0,R:0,K:0,DP:0,E:0};
    return rows[num];
  }
  game.plays.forEach(p=>{
    if (p.type==="sub" || p.type==="posswap") return;
    if (p.side==="us"){
      const r = ensure(p.batterNumber||"?", p.batterName||"?");
      r.PA++;
      if (p.code!=="BB" && p.code!=="SF") r.AB++;
      if (["1B","2B","3B","HR"].includes(p.code)){ r.H++; r[p.code]++; }
      if (p.code==="BB") r.BB++;
      if (p.code==="SF") r.SF++;
      if (p.code==="K") r.K++;
      if (p.code==="DP") r.DP++;
      r.RBI += p.rbi||0;
      if (Array.isArray(p.scorers)){
        p.scorers.forEach(sc=>{ ensure(sc.number, sc.name).R++; });
      }
    }
    if (p.errorBy){
      const slot = game.lineup.find(l=>l.id===p.errorBy);
      if (slot){ const r = ensure(slot.number, slot.name); r.E++; }
    }
  });
  // Admin manual overrides — win over whatever the play log computed.
  // A partial override (e.g. just {RBI:3}) only replaces that one field;
  // an override for a number with no plays at all creates a fresh row.
  const ov = (game.statOverrides && game.statOverrides.batting) || {};
  Object.keys(ov).forEach(number=>{
    const o = ov[number];
    const name = o.name || rosterLookup(number) || (rows[number]||{}).name || ("#"+number);
    const r = ensure(number, name);
    Object.assign(r, o);
    r.number = number;
  });
  return Object.values(rows).sort((a,b)=> (game.lineup.findIndex(l=>l.number===a.number)) - (game.lineup.findIndex(l=>l.number===b.number)));
}

function computePitching(game){
  const rows = {}; // key = number (not pitcherId, so overrides can target
                    // a pitcher directly even with no linked plays)
  function ensure(number,name){
    if (!rows[number]) rows[number] = {number,name,K:0,BB:0,R:0,outs:0};
    return rows[number];
  }
  game.plays.forEach(p=>{
    if (p.side!=="opp") return;
    // Prefer the pitcher snapshot recorded on the play itself (number/name
    // captured at record time) so stats stay with whoever actually pitched
    // even after later substitutions change who occupies that lineup slot.
    // Fall back to the old slot-id lookup for plays recorded before this
    // snapshot existed.
    let number = p.pitcherNumber, name = p.pitcherName;
    if (!number){
      if (!p.pitcherId) return;
      const slot = game.lineup.find(l=>l.id===p.pitcherId);
      if (!slot) return;
      number = slot.number; name = slot.name;
    }
    if (!number) return;
    const r = ensure(number, name || rosterLookup(number) || ("#"+number));
    if (p.code==="K") r.K++;
    if (p.code==="BB") r.BB++;
    r.R += p.runs||0;
    r.outs += p.outs||0;
  });
  const ov = (game.statOverrides && game.statOverrides.pitching) || {};
  Object.keys(ov).forEach(number=>{
    const o = ov[number];
    const name = o.name || rosterLookup(number) || (rows[number]||{}).name || ("#"+number);
    const r = ensure(number, name);
    Object.assign(r, o);
    r.number = number;
  });
  return Object.values(rows);
}

async function editPlayField(idx, field, value){
  const g = AppState.game;
  const p = g.plays[idx];
  if (!p) return;
  if (field==="rbi" || field==="runs" || field==="outs"){
    p[field] = Math.max(0, parseInt(value,10)||0);
  } else if (field==="code"){
    p.code = value;
  } else if (field==="batterNumber"){
    p.batterNumber = value.trim();
  } else if (field==="batterName"){
    p.batterName = value.trim();
  }
  // Deliberately NOT calling render() here on success: this is a plain
  // value edit on an existing <select>/<input> inside a long, scrollable
  // "編輯紀錄" modal (a finished game can have 25-30+ rows) — the control
  // the user just touched already shows the new value on its own (that's
  // how native form controls work), so there is nothing left to redraw.
  // A full render() would blow away and rebuild the ENTIRE modal's DOM
  // (every view function replaces $app.innerHTML from scratch), which on
  // real phones was observed to knock the modal's scroll position back to
  // the top and/or interrupt the native <select> picker's own closing
  // animation/focus handling right as it fires. persistGame() still runs
  // (so the value reaches the store), and on FAILURE appAlert() (called
  // from inside persistGame()) still renders to show the error modal —
  // only the success path skips the redraw.
  await persistGame();
}
async function deletePlayAt(idx){

  const g = AppState.game;

/* ---------- End game: winning pitcher / MVP ---------- */
// Version 24: widened after a user report that a pitcher who was already
// substituted out by the time the game ended could not be selected as
// the winning pitcher. The list used to be built ONLY from
// computePitching()'s rows (derived from plays snapshot-tagged with a
// pitcherNumber) plus whoever currently stands at "投" — reasonable in
// theory, but fragile in practice: a pitcher who faced batters only via
// plays recorded before this app tracked per-play pitcher snapshots, or
// whose only defensive plays were later edited/deleted, or who pitched in
// a sparsely-logged/retroactively-entered game (see g_hist01/g_hist02,
// which have no "投" position and no defensive plays at all, yet one of
// them already has a finalWinPitcher that could never have been chosen
// through this exact list) — any of these would silently vanish from the
// list with no way to pick them back. Rather than trying to perfectly
// reconstruct "who held the mound when" from the substitution log (which
// doesn't always carry enough detail, especially for older entries), we
// widen this to a strict superset: every player who has been part of
// this game in ANY capacity — current lineup (any position), bench, or
// anyone who has batted for us — is offered as a candidate, in addition
// to the original computePitching()/current-投 sources. The scorer
// always knows who actually pitched even when the log doesn't fully
// capture it, so this trades a slightly longer chip list for never again
// silently hiding the person who should be selectable.
function pitchingCandidates(game){
  const list = computePitching(game).map(r=>({number:r.number,name:r.name}));
  const seen = new Set(list.map(r=>r.number));
  function add(number,name){
    if (number && !seen.has(number)){ list.push({number,name}); seen.add(number); }
  }
  game.lineup.forEach(r=>{ if (r.position==="投") add(r.number, r.name); });
  game.lineup.forEach(r=>add(r.number, r.name));
  (game.bench||[]).forEach(r=>add(r.number, r.name));
  game.plays.forEach(p=>{ if (p.side==="us" && p.batterNumber) add(p.batterNumber, p.batterName); });
  return list;
}
function allOurPlayers(game){
  const map = {};
  game.lineup.forEach(r=>{ if (r.number) map[r.number]=r.name; });
  game.plays.forEach(p=>{ if (p.side==="us" && p.batterNumber) map[p.batterNumber]=p.batterName; });
  return Object.entries(map).map(([number,name])=>({number,name}));
}
function openEndGame(){
  const g = AppState.game;
  AppState.ui.endWinPitcher = g.finalWinPitcher || null;
  AppState.ui.endMvp = g.finalMvp || null;
  AppState.ui.showEndGame = true;
  render();
}
function closeEndGame(){ AppState.ui.showEndGame=false; render(); }
function selectWinPitcher(number,name){
  const cur = AppState.ui.endWinPitcher;
  AppState.ui.endWinPitcher = (cur && cur.number===number) ? null : {number,name};
  render();
}
function selectMvp(number,name){
  const cur = AppState.ui.endMvp;
  AppState.ui.endMvp = (cur && cur.number===number) ? null : {number,name};
  render();
}
function renderEndGameModal(){
  const g = AppState.game;
  const us = ourTotal(g), opp = oppTotal(g);
  const weWon = us>opp, tie = us===opp;
  const resultText = weWon ? "獲勝" : (tie ? "平手" : "落敗");
  const pitchOpts = pitchingCandidates(g);
  const mvpOpts = allOurPlayers(g);
  return `<div class="modal-back" onclick="if(event.target===this){closeEndGame();}">
    <div class="modal">
      <button class="close-x" onclick="closeEndGame();">×</button>
      <h3>結束比賽</h3>
      <div class="hint" style="margin-bottom:10px;">最終比分 ${esc(g.ourTeamName)} ${us} : ${opp} ${esc(g.opponent)} · ${resultText}</div>
      ${weWon ? `
      <div class="card" style="margin-top:0;">
        <h2 style="font-size:16px;">勝投（選填）</h2>
        <div class="chip-picker" style="margin-top:8px;">
          ${pitchOpts.length ? pitchOpts.map(r=>`<span class="chip ${AppState.ui.endWinPitcher&&AppState.ui.endWinPitcher.number===r.number?'sel':''}" onclick="selectWinPitcher('${r.number}','${esc(r.name)}')">#${esc(r.number)} ${esc(r.name)}</span>`).join("") : '<span class="roster-hint">尚無投手紀錄</span>'}
        </div>
      </div>` : `<div class="hint">平手或落敗不需要選勝投。</div>`}
      <div class="card">
        <h2 style="font-size:16px;">MVP（選填）</h2>
        <div class="chip-picker" style="margin-top:8px;">
          ${mvpOpts.map(r=>`<span class="chip ${AppState.ui.endMvp&&AppState.ui.endMvp.number===r.number?'sel':''}" onclick="selectMvp('${r.number}','${esc(r.name)}')">#${esc(r.number)} ${esc(r.name)}</span>`).join("")}
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn ghost" style="flex:1;" onclick="closeEndGame();">取消</button>
        <button class="btn primary" style="flex:2;" onclick="confirmEndGame();">確認結束比賽</button>
      </div>
    </div>
  </div>`;
}
async function confirmEndGame(){
  const g = AppState.game;
  const wasFinal = g.status==="final";
  if (wasFinal && !requireAdmin("修改已完賽的勝投／MVP")) return;
  g.status = "final";
  g.finalWinPitcher = AppState.ui.endWinPitcher || null;
  g.finalMvp = AppState.ui.endMvp || null;
  g.updatedAt = Date.now();

  let res;
  if (wasFinal){
    res = await Store.saveGame(g); // already archived; just an update
  } else {
    res = await Store.moveGame(g, "games", "games_final");
  }
  if (res && res.ok===false){
    if (!wasFinal) g.status = "live"; // revert so the game keeps playing normally
    appAlert("儲存失敗，請檢查網路連線後再試一次。");
    render();
    return;
  }
  if (!wasFinal) await Store.setActiveGameId(null);
  AppState.ui.showEndGame=false;
  AppState.ui.showBox=false;
  AppState.games = await Store.listGames();
  render();
}

async function reopenGame(){
  const g = AppState.game;
  if (!requireAdmin("重新開放已完賽的紀錄")) return;
  g.status = "live";
  g.updatedAt = Date.now();
  const res = await Store.moveGame(g, "games_final", "games");
  if (res && res.ok===false){
    g.status = "final";
    appAlert("儲存失敗，請檢查網路連線後再試一次。");
    render();
    return;
  }
  await Store.setActiveGameId(g.id);
  AppState.games = await Store.listGames();
  // Drop straight into the record editor so "reopen for editing" actually
  // lands somewhere editable, instead of the plain live-scoring screen.
  ensureOverrides(g);
  AppState.ui.showEditGame = true;
  render();
}

async function deleteFinishedGame(){
  const g = AppState.game;
  if (!requireAdmin("刪除已完賽的紀錄")) return;
  if (!(await appConfirm("確定要刪除「"+g.ourTeamName+" vs "+g.opponent+"」這場比賽紀錄嗎？此動作無法復原。"))) return;
  const res = await Store.deleteGame(g.id, true);
  if (res && res.ok===false){
    appAlert("刪除失敗，請檢查網路連線後再試一次。");
    return;
  }
  await Store.setActiveGameId(null);
  AppState.game = null;
  AppState.view = "home";
  AppState.games = await Store.listGames();
  render();
}

/* ---------- Roster editor (simple) ---------- */
function openRosterEditor(){
  const list = AppState.roster.map(p=>`<div class="lineup-row">
    <div class="num-input" style="text-align:center;font-weight:700;">#${esc(p.number)}</div>
    <div class="name-out">${esc(p.name)}</div>
  </div>`).join("");
  const back = document.createElement("div");
  back.className="modal-back";
  back.onclick = (e)=>{ if (e.target===back) back.remove(); };
  back.innerHTML = `<div class="modal">
    <button class="close-x" onclick="this.closest('.modal-back').remove()">×</button>
    <h3>球隊名單</h3>
    <div class="hint" style="font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;">共 ${AppState.roster.length} 名球員（背號／姓名）。可於下方新增。</div>
    ${list}
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input type="text" id="new-num" placeholder="背號" style="width:86px;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
      <input type="text" id="new-name" placeholder="姓名" style="flex:1;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
      <button class="btn primary" onclick="addRosterPlayer()">新增</button>
    </div>
  </div>`;
  document.body.appendChild(back);
}
async function addRosterPlayer(){
  const num = document.getElementById("new-num").value.trim();
  const name = document.getElementById("new-name").value.trim();
  if (!num || !name) return;
  AppState.roster.push({number:num, name});
  await Store.saveRoster(AppState.roster);
  document.querySelectorAll(".modal-back").forEach(m=>m.remove());
  openRosterEditor();
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
async function boot(){
  AppState.roster = await Store.getRoster();
  AppState.games = await Store.listGames();
  const activeId = await Store.getActiveGameId();
  if (activeId){
    const g = await Store.loadGame(activeId);
    if (g && g.status!=="final"){
      AppState.game = g;
      AppState.view = g.status==="setup" ? "lineup" : "game";
      render();
      return;
    }
  }
  AppState.view = "home";
  render();
}

// hot-reload aware boot so open viewers don't lose live game state on republish
if (window.claude && window.claude.hot){
  window.claude.hot.snapshot ? null : null;
  const start = ()=>boot();
  window.claude.hot.ready ? window.claude.hot.ready(start) : start();
} else {
  boot();
}
</script>
